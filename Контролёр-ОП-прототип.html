<script>
const screens = {"cockpit.html": "<!doctype html>\n<html lang=\"ru\">\n<head>\n<meta charset=\"utf-8\" />\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\" />\n<title>Контролёр ОП · Кокпит — CRM/ERP</title>\n<style>\n  :root{\n    --canvas:#F4F5F7; --ink:#1F2937; --muted:#6B7280; --line:#EEF0F3;\n    --brand:#2563EB; --brand-50:#EFF5FF; --brand-100:#EAF1FF;\n    --green:#059669; --green-bg:#ECFDF5; --green-500:#10B981;\n    --amber:#D97706; --amber-bg:#FFFBEB; --amber-500:#F59E0B;\n    --red:#DC2626; --red-bg:#FEF2F2; --red-500:#EF4444;\n    --violet:#7C3AED; --violet-bg:#F5F3FF; --violet-500:#8B5CF6;\n    --teal:#0D9488; --teal-bg:#F0FDFA; --teal-500:#14B8A6;\n    --slate:#64748B; --slate-bg:#F1F5F9; --slate-400:#94A3B8;\n    --shadow:0 1px 2px rgba(16,24,40,.04), 0 1px 3px rgba(16,24,40,.06);\n  }\n  *{box-sizing:border-box}\n  html,body{margin:0;background:var(--canvas);color:var(--ink);\n    font-family:system-ui,-apple-system,\"Segoe UI\",Roboto,Inter,Arial,sans-serif;-webkit-font-smoothing:antialiased}\n  a{color:inherit;text-decoration:none}\n  .topbar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #E5E7EB}\n  .topbar .row{max-width:1220px;margin:0 auto;padding:10px 24px;display:flex;align-items:center;gap:14px}\n  .logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px}\n  .logo .mark{width:30px;height:30px;border-radius:8px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px}\n  .crumb{color:var(--muted);font-size:13px} .crumb b{color:var(--ink)}\n  .back{margin-left:auto;color:var(--muted);font-size:13px;border:1px solid #E5E7EB;border-radius:8px;padding:6px 12px}\n  .tabs{max-width:1220px;margin:0 auto;padding:0 24px;display:flex;gap:2px;flex-wrap:wrap}\n  .tab{position:relative;padding:11px 14px;font-size:14px;color:var(--slate);white-space:nowrap}\n  .tab:hover{color:var(--ink)}\n  .tab.active{color:var(--brand);font-weight:600}\n  .tab.active::after{content:\"\";position:absolute;left:10px;right:10px;bottom:-1px;height:2px;border-radius:2px;background:var(--brand)}\n  .wrap{max-width:1220px;margin:0 auto;padding:22px 24px 70px}\n  h1{font-size:21px;font-weight:700;margin:0}\n  .sub{color:var(--muted);font-size:14px;margin:4px 0 0}\n  .caption{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--slate-400)}\n  .grid{display:grid;gap:16px}\n  @media(min-width:900px){.g2{grid-template-columns:1fr 1fr}.g4{grid-template-columns:repeat(4,1fr)}}\n  .card{background:#fff;border-radius:16px;box-shadow:var(--shadow);padding:20px}\n  .card.tight{padding:0}\n  .card.lv{border-left:4px solid var(--violet-500)}\n  .card.lr{border-left:4px solid var(--red-500)}\n  .kpis{display:grid;grid-template-columns:repeat(2,1fr)}\n  @media(min-width:640px){.kpis{grid-template-columns:repeat(3,1fr)}}\n  @media(min-width:1040px){.kpis{grid-template-columns:repeat(6,1fr)}}\n  .kpi{padding:16px 18px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}\n  .kpi .v{font-size:19px;font-weight:700}\n  .kpi .l{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.25}\n  .kpi .s{font-size:10px;color:var(--slate-400)}\n  .tag{display:inline-flex;align-items:center;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:600;background:var(--slate-bg);color:var(--slate)}\n  .t-green{background:var(--green-bg);color:var(--green)} .t-amber{background:var(--amber-bg);color:var(--amber)}\n  .t-red{background:var(--red-bg);color:var(--red)} .t-violet{background:var(--violet-bg);color:var(--violet)}\n  .t-teal{background:var(--teal-bg);color:var(--teal)} .t-brand{background:var(--brand-100);color:var(--brand)}\n  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}\n  .d-green{background:var(--green-500)} .d-amber{background:var(--amber-500)} .d-red{background:var(--red-500)} .d-teal{background:var(--teal-500)}\n  .bar{height:8px;border-radius:999px;background:#F1F5F9;overflow:hidden}\n  .bar>i{display:block;height:100%;border-radius:999px;background:var(--brand)}\n  .f-green{background:var(--green-500)!important} .f-amber{background:var(--amber-500)!important} .f-red{background:var(--red-500)!important}\n  .f-teal{background:var(--teal-500)!important} .f-slate{background:var(--slate-400)!important}\n  .strong{font-weight:700} .muted{color:var(--muted)} .small{font-size:12px}\n  .hl-amber{background:var(--amber-bg);color:#92400E;border-radius:12px;padding:12px;font-size:13px;line-height:1.4}\n  .hl-green{background:var(--green-bg);color:#065F46;border-radius:12px;padding:12px;font-size:13px;line-height:1.4}\n  .btn{border:none;border-radius:9px;padding:7px 13px;font-size:12px;font-weight:600;cursor:pointer}\n  .btn-pri{background:var(--brand);color:#fff} .btn-red{background:var(--red);color:#fff} .btn-ghost{background:#fff;border:1px solid #E5E7EB;color:var(--slate)}\n  .att{border-left:2px solid;border-radius:0 8px 8px 0;padding-left:12px}\n  .att.green{border-color:var(--green-500)} .att.amber{border-color:var(--amber-500)} .att.red{border-color:var(--red-500)} .att.slate{border-color:var(--slate-400)} .att.violet{border-color:var(--violet-500)}\n  .row-between{display:flex;align-items:center;justify-content:space-between;gap:8px}\n  .dep{display:flex;flex-direction:column;gap:10px}\n  .dep .hd{display:flex;align-items:center;justify-content:space-between}\n  .dep .big{font-size:22px;font-weight:700}\n  .dep .ln{display:flex;align-items:center;justify-content:space-between;font-size:12px;gap:8px}\n  .dep .ln .nm{color:var(--ink)} .dep .ln .v{color:var(--muted);font-variant-numeric:tabular-nums}\n  .stub{opacity:.6}\n  .note{font-size:12px;color:var(--slate-400);margin-top:18px}\n</style>\n</head>\n<body>\n\n<div class=\"topbar\">\n  <div class=\"row\">\n    <span class=\"logo\"><span class=\"mark\">◆</span> ERP</span>\n    <span class=\"crumb\">ERP / <b>Контролёр</b></span>\n    <a class=\"back\" href=\"cockpit.html\">← В приложение</a>\n  </div>\n  <nav class=\"tabs\">\n    <a class=\"tab active\" href=\"cockpit.html\">Кокпит</a>\n    <a class=\"tab\" href=\"focus.html\">Фокус-сделки</a>\n    <a class=\"tab\" href=\"okk.html\">ОКК · звонки</a>\n    <a class=\"tab\" href=\"funnel.html\">Показатели</a>\n    <a class=\"tab\" href=\"money.html\">Конверсия и деньги</a>\n    <a class=\"tab\" href=\"reviews.html\">Разборы</a>\n  </nav>\n</div>\n\n<div class=\"wrap\">\n  <div class=\"row-between\" style=\"align-items:flex-start\">\n    <div>\n      <h1>Контролёр — ежедневная дисциплина и качество</h1>\n      <p class=\"sub\">Пилот — <b>отдел продаж (ОП)</b>, по регламенту HR. Контролёр следит за исполнением (действия до 12:00, дела, звонки), <b>слушает звонки и ставит баллы (ОКК)</b>, разбирает причины переносов и провалов. Каркас рассчитан на все отделы.</p>\n    </div>\n    <span class=\"tag t-brand\">Сегодня · 13.06.2026 · ОП</span>\n  </div>\n\n  <!-- KPI контролёра ОП (из таблиц HR) -->\n  <div class=\"card tight\" style=\"margin-top:16px;overflow:hidden\">\n    <div class=\"kpis\">\n      <div class=\"kpi\"><div class=\"v\" style=\"color:var(--amber)\">74%</div><div class=\"l\">Действия до 12:00</div><div class=\"s\">17 из 23 фокус-сделок · цель 100%</div></div>\n      <div class=\"kpi\"><div class=\"v\" style=\"color:var(--green)\">7.8</div><div class=\"l\">Средний балл звонка</div><div class=\"s\">ОКК · из 10 · ↑ 0.4 к нед.</div></div>\n      <div class=\"kpi\"><div class=\"v\" style=\"color:var(--red)\">5</div><div class=\"l\">Сделок без дел</div><div class=\"s\">нет запланированного шага</div></div>\n      <div class=\"kpi\"><div class=\"v\" style=\"color:var(--red)\">4</div><div class=\"l\">Просрочено дел</div><div class=\"s\">сегодня</div></div>\n      <div class=\"kpi\"><div class=\"v\">31%</div><div class=\"l\">Конверсия недели</div><div class=\"s\">успех / всего · чистая 24%</div></div>\n      <div class=\"kpi\"><div class=\"v\" style=\"color:var(--green)\">82%</div><div class=\"l\">ВП к плану</div><div class=\"s\">валовая прибыль · контекст РОП</div></div>\n    </div>\n  </div>\n\n  <!-- Каркас по отделам: ОП раскрыт, остальные — заглушки -->\n  <p class=\"caption\" style=\"margin-top:24px\">Отделы под контролем</p>\n  <div class=\"grid g4\" style=\"margin-top:10px\">\n\n    <!-- ОП — раскрыт -->\n    <div class=\"card dep\" style=\"border-left:4px solid var(--brand)\">\n      <div class=\"hd\"><span class=\"strong\">Отдел продаж</span><span class=\"tag t-brand\">пилот · активен</span></div>\n      <div><span class=\"big\" style=\"color:var(--amber)\">74%</span> <span class=\"muted small\">действий до 12:00</span></div>\n      <div class=\"bar\" style=\"height:6px\"><i class=\"f-amber\" style=\"width:74%\"></i></div>\n      <div class=\"ln\"><span class=\"nm\">Средний балл звонка</span><span class=\"v\">7.8 / 10</span></div>\n      <div class=\"ln\"><span class=\"nm\">Просрочено дел</span><span class=\"v\" style=\"color:var(--red)\">4</span></div>\n      <div class=\"ln\"><span class=\"nm\">Сделок без дел</span><span class=\"v\" style=\"color:var(--red)\">5</span></div>\n      <a class=\"btn btn-pri\" style=\"text-align:center;margin-top:auto\" href=\"focus.html\">Фокус-сделки дня →</a>\n    </div>\n\n    <!-- Заглушки -->\n    <div class=\"card dep stub\">\n      <div class=\"hd\"><span class=\"strong\">Закуп</span><span class=\"tag\">скоро</span></div>\n      <div class=\"muted small\" style=\"margin-top:6px\">Тот же паттерн: ежедневный чек действий, SLA по задачам, причины переносов.</div>\n      <div class=\"ln\" style=\"margin-top:auto\"><span class=\"nm muted\">Контроль</span><span class=\"v\">не настроен</span></div>\n    </div>\n    <div class=\"card dep stub\">\n      <div class=\"hd\"><span class=\"strong\">Производство</span><span class=\"tag\">скоро</span></div>\n      <div class=\"muted small\" style=\"margin-top:6px\">Нормо-часы, ОТК, сроки партий — подключим по образцу ОП.</div>\n      <div class=\"ln\" style=\"margin-top:auto\"><span class=\"nm muted\">Контроль</span><span class=\"v\">не настроен</span></div>\n    </div>\n    <div class=\"card dep stub\">\n      <div class=\"hd\"><span class=\"strong\">Офис</span><span class=\"tag\">скоро</span></div>\n      <div class=\"muted small\" style=\"margin-top:6px\">Дедлайны документов (ЭСЧФ/ТТН/договор), возврат оригиналов.</div>\n      <div class=\"ln\" style=\"margin-top:auto\"><span class=\"nm muted\">Контроль</span><span class=\"v\">не настроен</span></div>\n    </div>\n  </div>\n\n  <!-- Горит сегодня + срез дня -->\n  <div class=\"grid g2\" style=\"margin-top:16px\">\n    <!-- Требует контролёра сейчас -->\n    <div class=\"card lr\">\n      <div class=\"row-between\">\n        <span class=\"caption\" style=\"color:var(--red)\">Требует контролёра сейчас</span>\n        <a class=\"small\" style=\"color:var(--brand)\" href=\"focus.html\">Все фокус-сделки →</a>\n      </div>\n      <div style=\"display:flex;flex-direction:column;gap:10px;margin-top:12px\">\n        <div class=\"att red\">\n          <div class=\"row-between\"><span class=\"strong small\">Сергей С. · 3 фокус-сделки без действий до 12:00</span><span class=\"tag t-red\">нет</span></div>\n          <div class=\"muted small\" style=\"margin-top:2px\">Авто-напоминание ушло в 12:05. Не отреагировал — взять на контроль.</div>\n          <button class=\"btn btn-pri\" style=\"margin-top:6px\">Напомнить лично</button>\n        </div>\n        <div class=\"att amber\">\n          <div class=\"row-between\"><span class=\"strong small\">«СтройКомплекс» · перенос без причины</span><span class=\"tag t-amber\">?</span></div>\n          <div class=\"muted small\" style=\"margin-top:2px\">Дело сдвинуто на завтра, причина не указана. Запросить у менеджера.</div>\n          <button class=\"btn btn-ghost\" style=\"margin-top:6px\">Спросить причину переноса</button>\n        </div>\n        <div class=\"att amber\">\n          <div class=\"row-between\"><span class=\"strong small\">«АльфаМеталл» · звонок 4.5/10</span><span class=\"tag t-amber\">слабо</span></div>\n          <div class=\"muted small\" style=\"margin-top:2px\">Нет побуждающих к продвижению вопросов. Разобрать с менеджером.</div>\n          <button class=\"btn btn-ghost\" style=\"margin-top:6px\">Открыть разбор звонка</button>\n        </div>\n      </div>\n    </div>\n\n    <!-- Срез дня (Показатели) -->\n    <div class=\"card\">\n      <div class=\"row-between\"><span class=\"caption\">Срез дня · воронка ОП</span><a class=\"small\" style=\"color:var(--brand)\" href=\"funnel.html\">Все показатели →</a></div>\n      <div class=\"grid g2\" style=\"margin-top:12px;gap:10px\">\n        <div class=\"hl-green\" style=\"padding:10px\"><div class=\"strong\" style=\"font-size:18px\">23</div><div class=\"small\">дел на сегодня</div></div>\n        <div class=\"hl-green\" style=\"padding:10px\"><div class=\"strong\" style=\"font-size:18px\">18</div><div class=\"small\">дел со звонком</div></div>\n        <div class=\"hl-amber\" style=\"padding:10px\"><div class=\"strong\" style=\"font-size:18px\">11 / 7</div><div class=\"small\">звонков до / после 12:00</div></div>\n        <div style=\"background:var(--red-bg);color:#991B1B;border-radius:12px;padding:10px\"><div class=\"strong\" style=\"font-size:18px\">5</div><div class=\"small\">сделок без дел</div></div>\n      </div>\n      <p class=\"caption\" style=\"margin-top:16px\">Сделки по статусам</p>\n      <div style=\"margin-top:8px\">\n        <div class=\"ln\" style=\"display:flex;justify-content:space-between\"><span class=\"small\">Сделка сформирована</span><span class=\"small strong\">42</span></div>\n        <div class=\"bar\" style=\"height:6px;margin-top:4px\"><i style=\"width:100%\"></i></div>\n        <div class=\"ln\" style=\"display:flex;justify-content:space-between;margin-top:8px\"><span class=\"small\">Отправлен счёт</span><span class=\"small strong\">19</span></div>\n        <div class=\"bar\" style=\"height:6px;margin-top:4px\"><i class=\"f-teal\" style=\"width:45%\"></i></div>\n        <div class=\"ln\" style=\"display:flex;justify-content:space-between;margin-top:8px\"><span class=\"small\">Счёт защищён</span><span class=\"small strong\">8</span></div>\n        <div class=\"bar\" style=\"height:6px;margin-top:4px\"><i class=\"f-green\" style=\"width:19%\"></i></div>\n      </div>\n    </div>\n  </div>\n\n  <!-- AI-ассистент -->\n  <div class=\"card lv\" style=\"margin-top:16px\">\n    <div class=\"row-between\">\n      <span class=\"caption\" style=\"color:var(--violet)\">Ассистент контролёра · сегодня</span>\n      <span class=\"tag t-violet\">Итерация 1 · ИИ</span>\n    </div>\n    <div class=\"grid g2\" style=\"margin-top:12px\">\n      <div class=\"att red\"><div class=\"strong small\">Сергей С. — 3 фокуса без шага до 12:00</div><div class=\"muted small\">Системно у него же 2 слабых звонка. Эскалировать РОПу + поставить разбор.</div></div>\n      <div class=\"att amber\"><div class=\"strong small\">2 переноса без причины за утро</div><div class=\"muted small\">Правило регламента нарушено. Запросить причину, иначе перенос не засчитывать.</div></div>\n      <div class=\"att green\"><div class=\"strong small\">Балл звонков растёт (7.4 → 7.8)</div><div class=\"muted small\">Работает разбор по целям прошлой недели — продолжить фокус на побуждающих вопросах.</div></div>\n      <div class=\"att slate\"><div class=\"strong small\">Граница с РОП</div><div class=\"muted small\">Деньги/план/конверсию ведёт РОП — здесь они как контекст. Уникальное контролёра: до 12:00, баллы, причины.</div></div>\n    </div>\n  </div>\n\n  <p class=\"note\">⚠️ Концепт-прототип блока «Контролёр» (пилот — ОП по таблицам HR «Фокус ОП» / «ОКК» / «Показатели 2026»). Данные демонстрационные, BYN. Баллы/риски — ручная отметка контролёра + подсказка по правилам, не модель.</p>\n</div>\n</body>\n</html>\n", "focus.html": "<!doctype html>\n<html lang=\"ru\">\n<head>\n<meta charset=\"utf-8\" />\n<meta name ef=\"focus.html\">Фокус-сделки</a>\n    <a class=\"tab active\" href=\"okk.html\">ОКК · звонки</a>\n    <a class=\"tab\" href=\"funnel.html\">Показатели</a>\n    <a class=\"tab\" href=\"money.html\">Конверсия и деньги</a>\n    <a class=\"tab\" href=\"reviews.html\">Разборы</a>\n  </nav>\n</div>\n\n<div class=\"wrap\">\n  <div class=\"row-between\" style=\"align-items:flex-start\">\n    <div>\n      <h1>ОКК — прослушивание и баллы по звонкам</h1>\n      <p class=\"sub\">Контроль качества: контролёр слушает звонки, ставит балл и пишет анализ. Отдельно — <b>разбор по целям</b> за выбранный день: тема разговора и были ли побуждающие к продвижению сделки вопросы.</p>\n    </div>\n    <div class=\"seg\">\n      <a href=\"#\">Нед. 23</a>\n      <a class=\"on\" href=\"#\">Нед. 24 (10–14.06)</a>\n      <a href=\"#\">Нед. 25</a>\n    </div>\n  </div>\n\n  <!-- Сводка по менеджерам -->\n  <div class=\"grid g3\">\n    <div class=\"card\">\n      <span class=\"caption\">Средний балл недели</span>\n      <div class=\"row-between\" style=\"margin-top:6px\"><span class=\"big\" style=\"color:var(--amber)\">7.8</span><span class=\"tag t-green\">↑ 0.4 к нед. 23</span></div>\n      <div class=\"lever\"><span>Анна А.</span><span class=\"strong\">8.6</span></div><div class=\"bar\"><i class=\"f-green\" style=\"width:86%\"></i></div>\n      <div class=\"lever\"><span>Дмитрий Д.</span><span class=\"strong\">7.9</span></div><div class=\"bar\"><i class=\"f-green\" style=\"width:79%\"></i></div>\n      <div class=\"lever\"><span>Мария М.</span><span class=\"strong\">7.4</span></div><div class=\"bar\"><i class=\"f-amber\" style=\"width:74%\"></i></div>\n      <div class=\"lever\"><span style=\"color:var(--red)\">Сергей С.</span><span class=\"strong\" style=\"color:var(--red)\">6.1</span></div><div class=\"bar\"><i class=\"f-red\" style=\"width:61%\"></i></div>\n    </div>\n    <div class=\"card\">\n      <span class=\"caption\">Покрытие прослушки</span>\n      <div class=\"big\" style=\"margin-top:6px\">38 <span class=\"muted small\" style=\"font-size:13px\">из 154 звонков</span></div>\n      <div class=\"muted small\" style=\"margin-top:4px\">25% звонков прослушано за неделю</div>\n      <div class=\"hl-amber\">Цель ОКК — ≥ 30% звонков и 100% звонков по фокус-сделкам. Сейчас фокус закрыт, общий охват добрать.</div>\n    </div>\n    <div class=\"card\">\n      <span class=\"caption\">Слабые зоны (по анализу)</span>\n      <div class=\"lever\"><span>Нет побуждающих вопросов</span><span class=\"strong\">11</span></div><div class=\"bar\"><i class=\"f-red\" style=\"width:55%\"></i></div>\n      <div class=\"lever\"><span>Не назначен след. шаг</span><span class=\"strong\">7</span></div><div class=\"bar\"><i class=\"f-amber\" style=\"width:35%\"></i></div>\n      <div class=\"lever\"><span>Слабая работа с ценой</span><span class=\"strong\">5</span></div><div class=\"bar\"><i class=\"f-amber\" style=\"width:25%\"></i></div>\n      <div class=\"lever\"><span>Не выявлена потребность</span><span class=\"strong\">3</span></div><div class=\"bar\"><i class=\"f-violet\" style=\"width:15%\"></i></div>\n    </div>\n  </div>\n\n  <!-- Журнал прослушанных звонков -->\n  <div class=\"card\" style=\"margin-top:16px\">\n    <span class=\"caption\">Журнал прослушанных звонков · неделя 24</span>\n    <table style=\"margin-top:12px\">\n      <thead><tr><th>Дата звонка</th><th>Дата прослуш.</th><th>Менеджер</th><th>Сделка</th><th>Анализ звонка</th><th class=\"num\">Балл</th></tr></thead>\n      <tbody>\n        <tr><td class=\"muted\">12.06</td><td class=\"muted\">12.06</td><td>Анна А.</td><td class=\"strong\">Сатурн</td><td class=\"muted small\">Чисто отработала цену, назначен счёт с дедлайном</td><td class=\"num\"><span class=\"score sc-hi\">9</span></td></tr>\n        <tr><td class=\"muted\">12.06</td><td class=\"muted\">13.06</td><td>Дмитрий Д.</td><td class=\"strong\">СтройКомплекс</td><td class=\"muted small\">Хорошо, но не зафиксировал конкретную дату следующего шага</td><td class=\"num\"><span class=\"score sc-mid\">7</span></td></tr>\n        <tr style=\"background:var(--red-bg)\"><td class=\"muted\">12.06</td><td class=\"muted\">13.06</td><td>Сергей С.</td><td class=\"strong\">АльфаМеталл</td><td class=\"muted small\">Нет ни одного побуждающего к продвижению вопроса, разговор «ни о чём»</td><td class=\"num\"><span class=\"score sc-lo\">4.5</span></td></tr>\n        <tr><td class=\"muted\">11.06</td><td class=\"muted\">12.06</td><td>Мария М.</td><td class=\"strong\">Тернопарк</td><td class=\"muted small\">Потребность выявлена, но скомкана презентация выгод</td><td class=\"num\"><span class=\"score sc-mid\">7</span></td></tr>\n        <tr><td class=\"muted\">11.06</td><td class=\"muted\">12.06</td><td>Сергей С.</td><td class=\"strong\">ТехноЛайн</td><td class=\"muted small\">Норм контакт, но перезвон позже обещанного срока</td><td class=\"num\"><span class=\"score sc-mid\">7</span></td></tr>\n      </tbody>\n    </table>\n  </div>\n\n  <!-- Разбор по целям (вкладка \"Разбор звонков\") -->\n  <div class=\"card\" style=\"margin-top:16px\">\n    <div class=\"row-between\">\n      <span class=\"caption\">Разбор звонков по целям · день 12.06 (все звонки ОП)</span>\n      <span class=\"tag t-brand\">47 звонков</span>\n    </div>\n    <p class=\"muted small\" style=\"margin-top:6px\">Контролёр слушает все звонки специалистов за день и размечает: на какую тему шёл разговор и были ли вопросы, побуждающие двигать сделку вперёд.</p>\n    <div class=\"grid g2\" style=\"margin-top:12px\">\n      <div>\n        <span class=\"caption\">Тема разговора</span>\n        <div class=\"lever\"><span>Продвижение сделки (счёт/договор)</span><span class=\"strong\">18</span></div><div class=\"bar\"><i class=\"f-green\" style=\"width:38%\"></i></div>\n        <div class=\"lever\"><span>Выявление потребности</span><span class=\"strong\">12</span></div><div class=\"bar\"><i class=\"f-green\" style=\"width:26%\"></i></div>\n        <div class=\"lever\"><span>Презентация / КП</span><span class=\"strong\">9</span></div><div class=\"bar\"><i class=\"f-amber\" style=\"width:19%\"></i></div>\n        <div class=\"lever\"><span>Болтовня / без цели</span><span class=\"strong\" style=\"color:var(--red)\">8</span></div><div class=\"bar\"><i class=\"f-red\" style=\"width:17%\"></i></div>\n      </div>\n      <div>\n        <span class=\"caption\">Были ли побуждающие вопросы?</span>\n        <div class=\"row-between\" style=\"margin-top:14px\">\n          <div style=\"text-align:center;flex:1\"><div class=\"big\" style=\"color:var(--green)\">62%</div><div class=\"small muted\">да — двигали сделку</div></div>\n          <div style=\"text-align:center;flex:1\"><div class=\"big\" style=\"color:var(--red)\">38%</div><div class=\"small muted\">нет — пассивный разговор</div></div>\n        </div>\n        <div class=\"hl-amber\">38% звонков без единого побуждающего вопроса — главный рычаг роста конверсии. Основной вклад — Сергей С. Вынести в разбор и в обучение.</div>\n      </div>\n    </div>\n  </div>\n\n  <p class=\"note\">⚠️ Концепт-прототип по файлу «ОКК в отделе продаж» (вкладки баллов по неделям + «Разбор звонков»). Балл и анализ — экспертная оценка контролёра. Данные демонстрационные.</p>\n</div>\n</body>\n</html>\n", "funnel.html": "<!doctype html>\n<html lang=\"ru\">\n<head>\n<meta charset=\"utf-8\" />\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\" />\n<title>Контролёр ОП · Показатели — CRM/ERP</title>\n<style>\n  :root{\n    --canvas:#F4F5F7; --ink:#1F2937; --muted:#6B7280; --line:#EEF0F3;\n    --brand:#2563EB; --brand-100:#EAF1FF;\n    --green:#059669; --green-bg:#ECFDF5; --green-500:#10B981;\n    --amber:#D97706; --amber-bg:#FFFBEB; --amber-500:#F59E0B;\n    --red:#DC2626; --red-bg:#FEF2F2; --red-500:#EF4444;\n    --violet:#7C3AED; --violet-bg:#F5F3FF; --violet-500:#8B5CF6;\n    --teal:#0D9488; --teal-bg:#F0FDFA; --teal-500:#14B8A6;\n    --slate:#64748B; --slate-bg:#F1F5F9; --slate-400:#94A3B8;\n    --shadow:0 1px 2px rgba(16,24,40,.04), 0 1px 3px rgba(16,24,40,.06);\n  }\n  *{box-sizing:border-box}\n  html,body{margin:0;background:var(--canvas);color:var(--ink);\n    font-family:system-ui,-apple-system,\"Segoe UI\",Roboto,Inter,Arial,sans-serif;-webkit-font-smoothing:antialiased}\n  a{color:inherit;text-decoration:none}\n  .topbar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #E5E7EB}\n  .topbar .row{max-width:1220px;margin:0 auto;padding:10px 24px;display:flex;align-items:center;gap:14px}\n  .logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px}\n  .logo .mark{width:30px;height:30px;border-radius:8px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px}\n  .crumb{color:var(--muted);font-size:13px} .crumb b{color:var(--ink)}\n  .back{margin-left:auto;color:var(--muted);font-size:13px;border:1px solid #E5E7EB;border-radius:8px;padding:6px 12px}\n  .tabs{max-width:1220px;margin:0 auto;padding:0 24px;display:flex;gap:2px;flex-wrap:wrap}\n  .tab{position:relative;padding:11px 14px;font-size:14px;color:var(--slate);white-space:nowrap}\n  .tab.active{color:var(--brand);font-weight:600}\n  .tab.active::after{content:\"\";position:absolute;left:10px;right:10px;bottom:-1px;height:2px;border-radius:2px;background:var(--brand)}\n  .wrap{max-width:1220px;margin:0 auto;padding:22px 24px 70px}\n  h1{font-size:21px;font-weight:700;margin:0}\n  .sub{color:var(--muted);font-size:14px;margin:4px 0 0}\n  .caption{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--slate-400)}\n  .card{background:#fff;border-radius:16px;box-shadow:var(--shadow);padding:18px;margin-top:16px}\n  .tag{display:inline-flex;align-items:center;border-radius:999px;padding:2px 8px;font-size:11px;font-weight:600;background:var(--slate-bg);color:var(--slate)}\n  .t-green{background:var(--green-bg);color:var(--green)} .t-amber{background:var(--amber-bg);color:var(--amber)} .t-red{background:var(--red-bg);color:var(--red)} .t-brand{background:var(--brand-100);color:var(--brand)}\n  /* metric tiles */\n  .mgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}\n  @media(min-width:680px){.mgrid{grid-template-columns:repeat(3,1fr)}}\n  @media(min-width:1000px){.mgrid{grid-template-columns:repeat(4,1fr)}}\n  .m{border:1px solid var(--line);border-radius:12px;padding:13px}\n  .m .v{font-size:22px;font-weight:700} .m .l{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.3}\n  .m.red{background:var(--red-bg)} .m.red .v{color:var(--red)}\n  .m.green .v{color:var(--green)} .m.amber .v{color:var(--amber)}\n  .funnel{display:flex;flex-direction:column;gap:8px;margin-top:14px}\n  .frow{display:flex;align-items:center;gap:12px}\n  .frow .nm{width:210px;font-size:13px}\n  .frow .track{flex:1;height:26px;background:#F1F5F9;border-radius:8px;overflow:hidden;position:relative}\n  .frow .track>i{display:block;height:100%;border-radius:8px;background:var(--brand)}\n  .frow .track span{position:absolute;left:10px;top:0;line-height:26px;font-size:12px;font-weight:700;color:#fff}\n  .frow .cv{width:74px;text-align:right;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}\n  table{width:100%;border-collapse:collapse;font-size:13px}\n  th{font-size:10px;text-transform:uppercase;letter-spacing:.03em;color:var(--slate-400);font-weight:600;text-align:left;padding-bottom:8px}\n  td{padding:9px 8px 9px 0;border-top:1px solid var(--line)}\n  .num{text-align:right;font-variant-numeric:tabular-nums}\n  .strong{font-weight:700} .muted{color:var(--muted)} .small{font-size:12px}\n  .row-between{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}\n  .note{font-size:12px;color:var(--slate-400);margin-top:14px}\n</style>\n</head>\n<body>\n<div class=\"topbar\">\n  <div class=\"row\">\n    <span class=\"logo\"><span class=\"mark\">◆</span> ERP</span>\n    <span class=\"crumb\">ERP / <b>Контролёр</b> / Показатели</span>\n    <a class=\"back\" href=\"cockpit.html\">← В приложение</a>\n  </div>\n  <nav class=\"tabs\">\n    <a class=\"tab\" href=\"cockpit.html\">Кокпит</a>\n    <a class=\"tab\" href=\"focus.html\">Фокус-сделки</a>\n    <a class=\"tab\" href=\"okk.html\">ОКК · звонки</a>\n    <a class=\"tab active\" href=\"funnel.html\">Показатели</a>\n    <a class=\"tab\" href=\"money.html\">Конверсия и деньги</a>\n    <a class=\"tab\" href=\"reviews.html\">Разборы</a>\n  </nav>\n</div>\n\n<div class=\"wrap\">\n  <h1>Показатели воронки и дисциплины ОП</h1>\n  <p class=\"sub\">Вкладка «Показатели 2026»: где стоят сделки, сколько дел и звонков, что просрочено. Контролёр снимает срез ежедневно — это его «приборная панель» исполнения.</p>\n\n  <!-- Воронка по статусам -->\n  <div class=\"card\">\n    <div class=\"row-between\"><span class=\"caption\">Сделки по статусам · до результата «Подписан договор»</span><span class=\"tag t-brand\">всего в воронке · 96</span></div>\n    <div class=\"funnel\">\n      <div class=\"frow\"><span class=\"nm\">Сделка сформирована</span><div class=\"track\"><i style=\"width:100%\"></i><span>42</span></div><span class=\"cv\">база</span></div>\n      <div class=\"frow\"><span class=\"nm\">Отправлен счёт</span><div class=\"track\"><i style=\"width:45%;background:var(--teal-500)\"></i><span>19</span></div><span class=\"cv\">45%</span></div>\n      <div class=\"frow\"><span class=\"nm\">Счёт защищён</span><div class=\"track\"><i style=\"width:19%;background:var(--amber-500)\"></i><span>8</span></div><span class=\"cv\">42%</span></div>\n      <div class=\"frow\"><span class=\"nm\">До результата (в работе)</span><div class=\"track\"><i style=\"width:62%;background:var(--slate-400)\"></i><span>27</span></div><span class=\"cv\">—</span></div>\n      <div class=\"frow\"><span class=\"nm\">Подписан договор</span><div class=\"track\"><i style=\"width:12%;background:var(--green-500)\"></i><span>5</span></div><span class=\"cv\">результат</span></div>\n    </div>\n    <p class=\"small muted\" style=\"margin-top:10px\">Узкое место по регламенту: «Отправлен счёт → Счёт защищён» (42%). Контролёр смотрит, что мешает защите счёта — цена, ЛПР, сроки.</p>\n  </div>\n\n  <!-- 11 счётчиков -->\n  <div class=\"card\">\n    <span class=\"caption\">Дела и звонки · сегодня 13.06</span>\n    <div class=\"mgrid\" style=\"margin-top:12px\">\n      <div class=\"m\"><div class=\"v\">96</div><div class=\"l\">Всего сделок в воронке</div></div>\n      <div class=\"m\"><div class=\"v\">42</div><div class=\"l\">Статус «Сделка сформирована»</div></div>\n      <div class=\"m\"><div class=\"v\">19</div><div class=\"l\">Статус «Отправлен счёт»</div></div>\n      <div class=\"m green\"><div class=\"v\">8</div><div class=\"l\">Статус «Счёт защищён»</div></div>\n      <div class=\"m\"><div class=\"v\">27</div><div class=\"l\">В работе до результата</div></div>\n      <div class=\"m\"><div class=\"v\">23</div><div class=\"l\">Дел на сегодня</div></div>\n      <div class=\"m green\"><div class=\"v\">18</div><div class=\"l\">Дел, в которых был звонок</div></div>\n      <div class=\"m green\"><div class=\"v\">11</div><div class=\"l\">Звонков до 12:00</div></div>\n      <div class=\"m amber\"><div class=\"v\">7</div><div class=\"l\">Звонков после 12:00</div></div>\n      <div class=\"m red\"><div class=\"v\">4</div><div class=\"l\">Просроченных дел</div></div>\n      <div class=\"m red\"><div class=\"v\">5</div><div class=\"l\">Сделок без дел</div></div>\n    </div>\n    <p class=\"small muted\" style=\"margin-top:12px\">«Сделок без дел» и «просроченные дела» — главные дисциплинарные триггеры: по ним контролёр идёт в Фокус-сделки и ставит/двигает задачу.</p>\n  </div>\n\n  <!-- По менеджерам -->\n  <div class=\"card\">\n    <span class=\"caption\">Разрез по менеджерам · сегодня</span>\n    <table style=\"margin-top:12px\">\n      <thead><tr><th>Менеджер</th><th class=\"num\">Дел</th><th class=\"num\">Со звонком</th><th class=\"num\">До 12:00</th><th class=\"num\">Просроч.</th><th class=\"num\">Без дел</th></tr></thead>\n      <tbody>\n        <tr><td class=\"strong\">Анна А.</td><td class=\"num\">6</td><td class=\"num\">6</td><td class=\"num\" style=\"color:var(--green)\">6</td><td class=\"num\">0</td><td class=\"num\">0</td></tr>\n        <tr><td class=\"strong\">Дмитрий Д.</td><td class=\"num\">5</td><td class=\"num\">5</td><td class=\"num\" style=\"color:var(--green)\">5</td><td class=\"num\">0</td><td class=\"num\">1</td></tr>\n        <tr><td class=\"strong\">Мария М.</td><td class=\"num\">5</td><td class=\"num\">4</td><td class=\"num\">4</td><td class=\"num\">1</td><td class=\"num\">0</td></tr>\n        <tr style=\"background:var(--red-bg)\"><td class=\"strong\">Сергей С.</td><td class=\"num\">7</td><td class=\"num\">3</td><td class=\"num\" style=\"color:var(--red)\">2</td><td class=\"num\" style=\"color:var(--red)\">3</td><td class=\"num\" style=\"color:var(--red)\">4</td></tr>\n        <tr class=\"strong\"><td>Итого</td><td class=\"num\">23</td><td class=\"num\">18</td><td class=\"num\">17</td><td class=\"num\">4</td><td class=\"num\">5</td></tr>\n      </tbody>\n    </table>\n    <p class=\"small muted\" style=\"margin-top:10px\">Сергей С. даёт почти всю просрочку и сделки без дел — совпадает с низким баллом звонков (ОКК 6.1). Системный кандидат на разбор.</p>\n  </div>\n\n  <p class=\"note\">⚠️ Концепт-прототип по вкладке «Показатели 2026» (файл «ОКК в отделе продаж»). Конверсии между статусами и срезы — демонстрационные. Реальные формулы — после выгрузки таблиц.</p>\n</div>\n</body>\n</html>\n", "money.html": "<!doctype html>\n<html lang=\"ru\">\n<head>\n<meta charset=\"utf-8\" />\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\" />\n<title>Контролёр ОП · Конверсия и деньги — CRM/ERP</title>\n<style>\n  :root{\n    --canvas:#F4F5F7; --ink:#1F2937; --muted:#6B7280; --line:#EEF0F3;\n    --brand:#2563EB; --brand-100:#EAF1FF;\n    --green:#059669; --green-bg:#ECFDF5; --green-500:# var(--slate);border-right:1px solid #E5E7EB}\n  .seg a:last-child{border-right:none} .seg a.on{background:var(--brand);color:#fff;font-weight:600}\n  .note{font-size:12px;color:var(--slate-400);margin-top:14px}\n</style>\n</head>\n<body>\n<div class=\"topbar\">\n  <div class=\"row\">\n    <span class=\"logo\"><span class=\"mark\">◆</span> ERP</span>\n    <span class=\"crumb\">ERP / <b>Контролёр</b> / Конверсия и деньги</span>\n    <a class=\"back\" href=\"cockpit.html\">← В приложение</a>\n  </div>\n  <nav class=\"tabs\">\n    <a class=\"tab\" href=\"cockpit.html\">Кокпит</a>\n    <a class=\"tab\" href=\"focus.html\">Фокус-сделки</a>\n    <a class=\"tab\" href=\"okk.html\">ОКК · звонки</a>\n    <a class=\"tab\" href=\"funnel.html\">Показатели</a>\n    <a class=\"tab active\" href=\"money.html\">Конверсия и деньги</a>\n    <a class=\"tab\" href=\"reviews.html\">Разборы</a>\n  </nav>\n</div>\n\n<div class=\"wrap\">\n  <div class=\"row-between\" style=\"align-items:flex-start\">\n    <div>\n      <h1>Конверсия и деньги — факт ОП</h1>\n      <p class=\"sub\">Движение воронки за неделю/месяц, валовая прибыль и счета. Контролёр снимает <b>факт</b>; план и прогноз ведёт РОП — здесь они как контекст и сверка.</p>\n    </div>\n    <div class=\"seg\"><a class=\"on\" href=\"#\">Неделя 24</a><a href=\"#\">Месяц июнь</a></div>\n  </div>\n\n  <div class=\"banner\">↔ Граница с РОП: эти показатели частично совпадают с кокпитом РОП. РОП отвечает за <b>план/прогноз/решения по сделкам</b>; контролёр — за <b>достоверность факта и дисциплину</b>, которая к этому факту привела. В проде — один источник данных, две роли-читателя.</div>\n\n  <!-- Конверсия неделя -->\n  <div class=\"grid g2\">\n    <div class=\"card\">\n      <span class=\"caption\">Движение ОП за неделю · общая конверсия</span>\n      <p class=\"small muted\" style=\"margin-top:4px\">Сделки, в которых были изменения на этой неделе.</p>\n      <div class=\"conv\">\n        <div class=\"cv g\"><div class=\"v\">14</div><div class=\"l\">успешных</div></div>\n        <div class=\"cv\"><div class=\"v\">31</div><div class=\"l\">в работе</div></div>\n        <div class=\"cv r\"><div class=\"v\">10</div><div class=\"l\">провальных</div></div>\n      </div>\n      <div class=\"lever\"><span>Конверсия успешных (14 / 55)</span><span class=\"strong\" style=\"color:var(--green)\">31%</span></div>\n      <div class=\"bar\"><i class=\"f-green\" style=\"width:31%\"></i></div>\n      <div class=\"lever\"><span>Доля провальных (10 / 55)</span><span class=\"strong\" style=\"color:var(--red)\">18%</span></div>\n      <div class=\"bar\"><i class=\"f-red\" style=\"width:18%\"></i></div>\n    </div>\n    <div class=\"card\">\n      <span class=\"caption\">Чистая конверсия недели</span>\n      <p class=\"small muted\" style=\"margin-top:4px\">Сделки, которые созданы И изменены на этой неделе.</p>\n      <div class=\"conv\">\n        <div class=\"cv g\"><div class=\"v\">6</div><div class=\"l\">успешных</div></div>\n        <div class=\"cv\"><div class=\"v\">25</div><div class=\"l\">всего за неделю</div></div>\n        <div class=\"cv r\"><div class=\"v\">4</div><div class=\"l\">провальных</div></div>\n      </div>\n      <div class=\"lever\"><span>Чистая конверсия (6 / 25)</span><span class=\"strong\" style=\"color:var(--green)\">24%</span></div>\n      <div class=\"bar\"><i class=\"f-green\" style=\"width:24%\"></i></div>\n      <div class=\"lever\"><span>Доля провальных (4 / 25)</span><span class=\"strong\" style=\"color:var(--amber)\">16%</span></div>\n      <div class=\"bar\"><i class=\"f-amber\" style=\"width:16%\"></i></div>\n    </div>\n  </div>\n\n  <!-- ВП / ГПР + по менеджерам -->\n  <div class=\"grid g2\">\n    <div class=\"card\">\n      <span class=\"caption\">Валовая прибыль (ГПР)</span>\n      <div class=\"row-between\" style=\"margin-top:10px\">\n        <div><div class=\"strong\" style=\"font-size:24px\">232 000 <span class=\"small muted\">BYN</span></div><div class=\"small muted\">ВП месяц · факт</div></div>\n        <div style=\"text-align:right\"><div class=\"strong\" style=\"font-size:24px;color:var(--green)\">82%</div><div class=\"small muted\">к плану 283 000</div></div>\n      </div>\n      <div class=\"bar\" style=\"height:10px;margin-top:10px\"><i class=\"f-green\" style=\"width:82%\"></i></div>\n      <div class=\"lever\"><span>ВП на человека (4 чел.)</span><span class=\"strong\">58 000 BYN</span></div>\n      <div class=\"bar\"><i class=\"f-green\" style=\"width:82%\"></i></div>\n      <p class=\"small muted\" style=\"margin-top:10px\">%выполнения и ВП/чел. считаются по формуле (как в «ГПР»). Контролёр сверяет: дисциплина → счета → ВП.</p>\n    </div>\n    <div class=\"card\">\n      <span class=\"caption\">По менеджерам · день (вкладка «ОП»)</span>\n      <table style=\"margin-top:10px\">\n        <thead><tr><th>Менеджер</th><th class=\"num\">ВП факт</th><th class=\"num\">% плана</th><th class=\"num\">Счетов</th><th class=\"num\">Σ счетов</th></tr></thead>\n        <tbody>\n          <tr><td class=\"strong\">Анна А.</td><td class=\"num\">3 200</td><td class=\"num\" style=\"color:var(--green)\">96%</td><td class=\"num\">4</td><td class=\"num\">41 000</td></tr>\n          <tr><td class=\"strong\">Дмитрий Д.</td><td class=\"num\">2 600</td><td class=\"num\" style=\"color:var(--amber)\">74%</td><td class=\"num\">3</td><td class=\"num\">28 000</td></tr>\n          <tr><td class=\"strong\">Мария М.</td><td class=\"num\">2 100</td><td class=\"num\" style=\"color:var(--amber)\">61%</td><td class=\"num\">2</td><td class=\"num\">16 000</td></tr>\n          <tr style=\"background:var(--red-bg)\"><td class=\"strong\">Сергей С.</td><td class=\"num\">1 300</td><td class=\"num\" style=\"color:var(--red)\">48%</td><td class=\"num\">1</td><td class=\"num\">6 000</td></tr>\n          <tr class=\"strong\"><td>Итого</td><td class=\"num\">9 200</td><td class=\"num\" style=\"color:var(--amber)\">82%</td><td class=\"num\">10</td><td class=\"num\">91 000</td></tr>\n        </tbody>\n      </table>\n    </div>\n  </div>\n\n  <!-- Рост специалистов -->\n  <div class=\"card\" style=\"margin-top:16px\">\n    <span class=\"caption\">Ежемесячный рост специалистов ОП (вкладка «Рост»)</span>\n    <table style=\"margin-top:10px\">\n      <thead><tr><th>Менеджер</th><th class=\"num\">Выручка</th><th class=\"num\">Себестоимость</th><th class=\"num\">Валовая прибыль</th><th class=\"num\">Средний чек</th><th class=\"num\">Рентаб., %</th></tr></thead>\n      <tbody>\n        <tr><td class=\"strong\">Анна А.</td><td class=\"num\">186 000</td><td class=\"num\">112 000</td><td class=\"num strong\">74 000</td><td class=\"num\">15 500</td><td class=\"num\" style=\"color:var(--green)\">40%</td></tr>\n        <tr><td class=\"strong\">Дмитрий Д.</td><td class=\"num\">152 000</td><td class=\"num\">98 000</td><td class=\"num strong\">54 000</td><td class=\"num\">12 700</td><td class=\"num\">36%</td></tr>\n        <tr><td class=\"strong\">Мария М.</td><td class=\"num\">98 000</td><td class=\"num\">66 000</td><td class=\"num strong\">32 000</td><td class=\"num\">9 800</td><td class=\"num\">33%</td></tr>\n        <tr><td class=\"strong\">Сергей С.</td><td class=\"num\">61 000</td><td class=\"num\">43 000</td><td class=\"num strong\">18 000</td><td class=\"num\">7 600</td><td class=\"num\" style=\"color:var(--red)\">30%</td></tr>\n      </tbody>\n    </table>\n    <p class=\"small muted\" style=\"margin-top:10px\">Тренд месяц-к-месяцу показывает, растёт ли специалист. Связка с ОКК: рост среднего чека и рентабельности идёт за ростом балла звонков.</p>\n  </div>\n\n  <p class=\"note\">⚠️ Концепт-прототип по вкладкам «ГПР», «ОП», «Движение ОП нед.», «Анализ ОП мес.», «Рост». Все суммы и %% — демонстрационные, BYN. Формулы %плана/конверсии — после выгрузки таблиц.</p>\n</div>\n</body>\n</html>\n", "reviews.html": "<!doctype html>\n<html lang=\"ru\">\n<head>\n<meta charset=\"utf-8\" />\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\" />\n<title>Контролёр ОП · Разборы — CRM/ERP</title>\n<style>\n  :root{\n    --canvas:#F4F5F7; --ink:#1F2937; --muted:#6B7280; --line:#EEF0F3;\n    --brand:#2563EB; --brand-100:#EAF1FF;\n    --green:#059669; --green-bg:#ECFDF5; --green-500:#10B981;\n    --amber:#D97706; --amber-bg:#FFFBEB; --amber-500:#F59E0B;\n    --red:#DC2626; --red-bg:#FEF2F2; --red-500:#EF4444;\n    --violet:#7C3AED; --violet-bg:#F5F3FF; --violet-500:#8B5CF6;\n    --teal:#0D9488; --teal-bg:#F0FDFA; --teal-500:#14B8A6;\n    --slate:#64748B; --slate-bg:#F1F5F9; --slate-400:#94A3B8;\n    --shadow:0 1px 2px rgba(16,24,40,.04), 0 1px 3px rgba(16,24,40,.06);\n  }\n  *{box-sizing:border-box}\n  html,body{margin:0;background:var(--canvas);color:var(--ink);\n    font-family:system-ui,-apple-system,\"Segoe UI\",Roboto,Inter,Arial,sans-serif;-webkit-font-smoothing:antialiased}\n  a{color:inherit;text-decoration:none}\n  .topbar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #E5E7EB}\n  .topbar .row{max-width:1220px;margin:0 auto;padding:10px 24px;display:flex;align-items:center;gap:14px}\n  .logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px}\n  .logo .mark{width:30px;height:30px;border-radius:8px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px}\n  .crumb{color:var(--muted);font-size:13px} .crumb b{color:var(--ink)}\n  .back{margin-left:auto;color:var(--muted);font-size:13px;border:1px solid #E5E7EB;border-radius:8px;padding:6px 12px}\n  .tabs{max-width:1220px;margin:0 auto;padding:0 24px;display:flex;gap:2px;flex-wrap:wrap}\n  .tab{position:relative;padding:11px 14px;font-size:14px;color:var(--slate);white-space:nowrap}\n  .tab.active{color:var(--brand);font-weight:600}\n  .tab.active::after{content:\"\";position:absolute;left:10px;right:10px;bottom:-1px;height:2px;border-radius:2px;background:var(--brand)}\n  .wrap{max-width:1220px;margin:0 auto;padding:22px 24px 70px}\n  h1{font-size:21px;font-weight:700;margin:0}\n  .sub{color:var(--muted);font-size:14px;margin:4px 0 0}\n  .caption{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--slate-400)}\n  .card{background:#fff;border-radius:16px;box-shadow:var(--shadow);padding:18px;margin-top:16px}\n  .tag{display:inline-flex;align-items:center;border-radius:999px;padding:2px 8px;font-size:11px;font-weight:600;background:var(--slate-bg);color:var(--slate)}\n  .t-green{background:var(--green-bg);color:var(--green)} .t-amber{background:var(--amber-bg);color:var(--amber)} .t-red{background:var(--red-bg);color:var(--red)} .t-brand{background:var(--brand-100);color:var(--brand)} .t-violet{background:var(--violet-bg);color:var(--violet)}\n  table{width:100%;border-collapse:collapse;font-size:13px}\n  th{font-size:10px;text-transform:uppercase;letter-spacing:.03em;color:var(--slate-400);font-weight:600;text-align:left;padding-bottom:8px}\n  td{padding:10px 8px 10px 0;border-top:1px solid var(--line);vertical-align:top}\n  .num{text-align:right;font-variant-numeric:tabular-nums}\n  .strong{font-weight:700} .muted{color:var(--muted)} .small{font-size:12px}\n  .bar{height:8px;border-radius:999px;background:#F1F5F9;overflow:hidden}\n  .bar>i{display:block;height:100%;border-radius:999px}\n  .f-red{background:var(--red-500)} .f-amber{background:var(--amber-500)} .f-slate{background:var(--slate-400)}\n  .lever{display:flex;justify-content:space-between;font-size:13px;margin:12px 0 4px}\n  .grid{display:grid;gap:16px;margin-top:16px}\n  @media(min-width:900px){.g2{grid-template-columns:1fr 1.3fr}}\n  .step{display:flex;align-items:center;gap:6px;flex-wrap:wrap}\n  .chip{font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--slate-bg);color:var(--slate)}\n  .chip.now{background:var(--brand);color:#fff}\n  .chip.done{background:var(--green-bg);color:var(--green)}\n  .arr{color:var(--slate-400)}\n  .att{border-left:3px solid;border-radius:0 8px 8px 0;padding:8px 12px;margin-top:10px}\n  .att.red{border-color:var(--red-500)} .att.amber{border-color:var(--amber-500)} .att.green{border-color:var(--green-500)}\n  .row-between{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}\n  .note{font-size:12px;color:var(--slate-400);margin-top:14px}\n</style>\n</head>\n<body>\n<div class=\"topbar\">\n  <div class=\"row\">\n    <span class=\"logo\"><span class=\"mark\">◆</span> ERP</span>\n    <span class=\"crumb\">ERP / <b>Контролёр</b> / Разборы</span>\n    <a class=\"back\" href=\"cockpit.html\">← В приложение</a>\n  </div>\n  <nav class=\"tabs\">\n    <a class=\"tab\" href=\"cockpit.html\">Кокпит</a>\n    <a class=\"tab\" href=\"focus.html\">Фокус-сделки</a>\n    <a class=\"tab\" href=\"okk.html\">ОКК · звонки</a>\n    <a class=\"tab\" href=\"funnel.html\">Показатели</a>\n    <a class=\"tab\" href=\"money.html\">Конверсия и деньги</a>\n    <a class=\"tab active\" href=\"reviews.html\">Разборы</a>\n  </nav>\n</div>\n\n<div class=\"wrap\">\n  <h1>Разборы — провалы недели и крупные сделки</h1>\n  <p class=\"sub\">Две регулярные процедуры контролёра: разбор <b>провальных сделок</b> за неделю (почему слили) и контроль движения по <b>крупным сделкам</b> (чтобы не зависли).</p>\n\n  <!-- Провалы -->\n  <div class=\"card\">\n    <div class=\"row-between\"><span class=\"caption\">Разбор провальных сделок · неделя 24 · 10 шт</span><span class=\"tag t-red\">сумма потерь 187 000 BYN</span></div>\n\n    <div class=\"grid g2\">\n      <div>\n        <span class=\"caption\">Причины провалов</span>\n        <div class=\"lever\"><span>Дорого / не согласовали цену</span><span class=\"strong\">4</span></div><div class=\"bar\"><i class=\"f-red\" style=\"width:40%\"></i></div>\n        <div class=\"lever\"><span>Долго думали → ушли к конкуренту</span><span class=\"strong\">3</span></div><div class=\"bar\"><i class=\"f-amber\" style=\"width:30%\"></i></div>\n        <div class=\"lever\"><span>Не дожали / пропал контакт</span><span class=\"strong\">2</span></div><div class=\"bar\"><i class=\"f-amber\" style=\"width:20%\"></i></div>\n        <div class=\"lever\"><span>Не наш профиль (дисквалиф.)</span><span class=\"strong\">1</span></div><div class=\"bar\"><i class=\"f-slate\" style=\"width:10%\"></i></div>\n        <div class=\"att red\"><div class=\"strong small\">Вывод контролёра</div><div class=\"muted small\">«Не дожали» + «долго думали» = 5 из 10 — это управляемые потери. Корень — слабые побуждающие вопросы (см. ОКК) и поздняя реакция. Управляемо обучением.</div></div>\n      </div>\n      <div>\n        <span class=\"caption\">Реестр провалов</span>\n        <table style=\"margin-top:10px\">\n          <thead><tr><th>Сделка</th><th>Менеджер</th><th class=\"num\">Сумма</th><th>Причина</th></tr></thead>\n          <tbody>\n            <tr><td class=\"strong\">МеталлТорг</td><td class=\"muted\">Сергей С.</td><td class=\"num\">64 000</td><td><span class=\"tag t-amber\">не дожал</span></td></tr>\n            <tr><td class=\"strong\">ПромСбыт</td><td class=\"muted\">Сергей С.</td><td class=\"num\">38 000</td><td><span class=\"tag t-amber\">долго думали</span></td></tr>\n            <tr><td class=\"strong\">ВостокСнаб</td><td class=\"muted\">Мария М.</td><td class=\"num\">29 000</td><td><span class=\"tag t-red\">цена</span></td></tr>\n            <tr><td class=\"strong\">ГрандЛогист</td><td class=\"muted\">Дмитрий Д.</td><td class=\"num\">26 000</td><td><span class=\"tag t-red\">цена</span></td></tr>\n            <tr><td class=\"strong\">СибПромТех</td><td class=\"muted\">Сергей С.</td><td class=\"num\">18 000</td><td><span class=\"tag t-amber\">пропал контакт</span></td></tr>\n            <tr><td class=\"muted small\" colspan=\"4\">…ещё 5 на 12 000 BYN</td></tr>\n          </tbody>\n        </table>\n        <p class=\"small muted\" style=\"margin-top:8px\">3 из топ-5 провалов — Сергей С. Совпадает с ОКК (балл 6.1) и Показателями (4 сделки без дел). Точка приложения — он.</p>\n      </div>\n    </div>\n  </div>\n\n  <!-- Крупные сделки -->\n  <div class=\"card\">\n    <div class=\"row-between\"><span class=\"caption\">Контроль движения по крупным сделкам</span><span class=\"tag t-brand\">порог ≥ 50 000 BYN · 5 в работе</span></div>\n    <table style=\"margin-top:12px\">\n      <thead><tr><th>Сделка</th><th>Менеджер</th><th class=\"num\">Сумма</th><th>Стадия / движение</th><th>Контроль</th></tr></thead>\n      <tbody>\n        <tr>\n          <td class=\"strong\">ООО ХимПром</td><td class=\"muted\">Анна А.</td><td class=\"num\">140 000</td>\n          <td><div class=\"step\"><span class=\"chip done\">Счёт</span><span class=\"arr\">→</span><span class=\"chip now\">Защита счёта</span><span class=\"arr\">→</span><span class=\"chip\">Договор</span></div><div class=\"small muted\" style=\"margin-top:3px\">движется, был контакт сегодня</div></td>\n          <td><span class=\"tag t-green\">в графике</span></td>\n        </tr>\n        <tr style=\"background:var(--amber-bg)\">\n          <td class=\"strong\">ООО АльфаМеталл</td><td class=\"muted\">Сергей С.</td><td class=\"num\">58 000</td>\n          <td><div class=\"step\"><span class=\"chip done\">КП</span><span class=\"arr\">→</span><span class=\"chip now\">Счёт</span></div><div class=\"small muted\" style=\"margin-top:3px\">3 дня без движения, балл звонка 4.5</div></td>\n          <td><span class=\"tag t-red\">завис → разбор</span></td>\n        </tr>\n        <tr>\n          <td class=\"strong\">ИП СтройКомплекс</td><td class=\"muted\">Дмитрий Д.</td><td class=\"num\">42 000</td>\n          <td><div class=\"step\"><span class=\"chip now\">Спецификация</span></div><div class=\"small muted\" style=\"margin-top:3px\">перенос без причины — уточняется</div></td>\n          <td><span class=\"tag t-amber\">следить</span></td>\n        </tr>\n        <tr>\n          <td class=\"strong\">ООО ТехноЛес</td><td class=\"muted\">Анна А.</td><td class=\"num\">96 000</td>\n          <td><div class=\"step\"><span class=\"chip done\">Защита</span><span class=\"arr\">→</span><span class=\"chip now\">Договор</span></div><div class=\"small muted\" style=\"margin-top:3px\">на согласовании договора (офис)</div></td>\n          <td><span class=\"tag t-green\">в графике</span></td>\n        </tr>\n        <tr>\n          <td class=\"strong\">ОАО ЭнергоСбыт</td><td class=\"muted\">Мария М.</td><td class=\"num\">72 000</td>\n          <td><div class=\"step\"><span class=\"chip now\">Защита счёта</span></div><div class=\"small muted\" style=\"margin-top:3px\">ждёт решение ЛПР до 16.06</div></td>\n          <td><span class=\"tag t-amber\">следить</span></td>\n        </tr>\n      </tbody>\n    </table>\n    <div class=\"att amber\"><div class=\"strong small\">Фокус контролёра</div><div class=\"muted small\">АльфаМеталл (58 000) завис на одном слабом менеджере — приоритет: разбор звонка + подключить РОПа, пока сделка не ушла в провал, как МеталлТорг.</div></div>\n  </div>\n\n  <p class=\"note\">⚠️ Концепт-прототип по вкладкам «Провалы» и «Крупные сделки». Суммы/причины — демонстрационные, BYN. Связки между экранами (провал ↔ ОКК ↔ показатели) — ключевая ценность: одна причина видна с разных сторон.</p>\n</div>\n</body>\n</html>\n"};

frame.addEventListener('load', function(){
  try {
    const doc = frame.contentDocument;
    if(!doc) return;
    doc.querySelectorAll('a').forEach(function(a){
      const href = a.getAttribute('href');
      if(href && screens[href]){
        a.addEventListener('click', function(e){ e.preventDefault(); show(href); });
      }
    });
  } catch(err){}
});
