# Конфигурация Alembic. Реальный URL БД подставляется в migrations/env.py
# из config/settings.py (переменная AIOS_DATABASE_URL).
[alembic]
script_location = migrations
prepend_sys_path = .
# плейсхолдер; фактический URL берётся из настроек приложения
sqlalchemy.url = postgresql+psycopg://aios:aios@localhost:5432/aios

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
