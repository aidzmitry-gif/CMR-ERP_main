[project]
name = "aios"
version = "0.1.0"
description = "AI-First Business Operating System — модульный каркас (ядро + плагины)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "ruff>=0.6",
    "testcontainers[postgres]>=4.7",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: изолированная бизнес-логика без I/O (база пирамиды, самые быстрые)",
    "api: эндпоинты через httpx ASGI на SQLite в памяти (середина пирамиды)",
    "integration: реальная инфраструктура — Postgres через testcontainers (медленные)",
]

[tool.coverage.run]
branch = true
source = ["core", "modules", "config"]
# SQLAlchemy async мостит sync↔async через greenlet, а ASGI-обработчики могут
# исполняться в worker-потоках — без concurrency coverage не видит их строки.
concurrency = ["thread", "greenlet"]
omit = ["*/__pycache__/*", "tests/*"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    ": \\.\\.\\.$",  # тела-заглушки Protocol-методов (контракты §2.4)
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I"]  # сортировка импортов
