name: ERP-READY selective E2E QA

on:
  push:
    branches:
      - "agent/erp-ready-001-e2e-20261017"

permissions:
  contents: read

jobs:
  e2e:
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install backend deps
        run: pip install -r requirements-dev.txt
      - name: Native dependencies for immutable document PDFs
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu-core
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Install Playwright (chromium)
        working-directory: frontend
        run: npx --no-install playwright install --with-deps chromium
      - name: Native PDF and exact remaining E2E scenarios
        shell: python
        run: |
          import hashlib
          import json
          import os
          import re
          import subprocess
          import sys
          from pathlib import Path

          root = Path.cwd()
          temp = Path(os.environ['RUNNER_TEMP'])
          summary_path = temp / 'erp-ready-e2e-summary.json'
          expected_sources = {'frontend/e2e/counterparties.spec.ts': '27e7b1bae0477a983c21a8a215d237f1361c62e61e4bd01615b4b0adb660501e', 'frontend/e2e/crm-own-cycle.spec.ts': '2abbcecd942765f164eec448ce6737f39e9e152012151a8cdd3f0e4b2458a6f1', 'frontend/e2e/crm-own-outcomes.spec.ts': '7c13375bd03937af425a817cf3f2e3bd2f47728a256b81f126d81dea2567ca24', 'frontend/e2e/deal-card.spec.ts': 'bcb66f622e6f54e51437e712c1f8a1327a4bfc6b6c2d6b46b6ad95cfb5621ec9', 'frontend/e2e/deals-board.spec.ts': '694519c4eefda774fb32cb82336e128b0f99f6ab23ae522a32e28e8fcb5df9b8', 'frontend/e2e/navigation.spec.ts': '996b3f56c58b0385b8e180d2bb6b83602cb844c38e4953983e2fa866f371a39f', 'frontend/e2e/procurement-deadlines.spec.ts': '5ffdb586955d4379bbb87bb591b8251116db732f4de53fe32dbb76d59c6a5155', 'frontend/e2e/crm-fixtures.ts': '43be79105c3fa04f1875ef7507e38e56cb5f25800e27d50221c1177100d75f98', 'scripts/seed_invoice_e2e.py': 'c83b6069b25aa6e43924281a7a210c4e065a1a685aa1e5aaaee14e4b68da3281'}
          expected_modules = {'finance': '59832b2f14a2ee02d8db266a67f8206616bdcd94', 'hr': 'f8a6e0142f1920b07ec56818f42d156a602ff9c3', 'leads': '9a304f771ba74369ded199168e0e1da3ad6348d2', 'logistics': '6923d2e021980ef2546f382364d38dc34a0fef29', 'marketing': 'd4ed67fdc9b41e7abc370112e1a3fa8a3fe1e282', 'procurement': 'f29ea84bd13342ae572e8c4499031d2f053d3d47', 'production': 'be7d7e198bf09cc41c642d22125db401da5adc48', 'sales': '37b3b1d752fe5b16d89ae01a535dc84360ac7591', 'service': '3d33800c44865cd7a7373b29192c5d59d3c4bec8', 'wms': '8b6fb881a03f1a268f07e65f4fa89d195fc933a2'}
          expected_cases = {tuple(case) for case in [["chromium", "crm-own-outcomes.spec.ts", "own outcomes preserve originals, tasks and stock reserve"], ["chromium", "crm-own-outcomes.spec.ts", "own outcomes preserve originals, tasks and on_order reserve"], ["chromium", "crm-own-outcomes.spec.ts", "own no-invoice loss finalizes with date, reason and history"], ["chromium", "deal-card.spec.ts", "\u043a\u0430\u0440\u0442\u043e\u0447\u043a\u0430 \u0441\u0434\u0435\u043b\u043a\u0438: \u0432\u044b\u043f\u0443\u0441\u043a \u0441\u0447\u0451\u0442\u0430 ERP \u0441 \u0440\u0435\u0437\u0435\u0440\u0432\u043e\u043c"], ["chromium", "deal-card.spec.ts", "\u0434\u043e\u043a\u0443\u043c\u0435\u043d\u0442\u044b: \u043e\u0448\u0438\u0431\u043a\u0430 \u0437\u0430\u0433\u0440\u0443\u0437\u043a\u0438 \u043e\u0442\u043b\u0438\u0447\u0430\u0435\u0442\u0441\u044f \u043e\u0442 \u043f\u0443\u0441\u0442\u043e\u0433\u043e \u0441\u043f\u0438\u0441\u043a\u0430 \u0438 \u0434\u043e\u043f\u0443\u0441\u043a\u0430\u0435\u0442 \u043f\u043e\u0432\u0442\u043e\u0440"], ["chromium", "deal-card.spec.ts", "\u0441\u0447\u0451\u0442 \u043f\u043e\u0434 \u0437\u0430\u043a\u0430\u0437: \u043f\u043e\u0442\u0435\u0440\u044f\u043d\u043d\u044b\u0439 \u043e\u0442\u0432\u0435\u0442, \u043f\u043e\u0432\u0442\u043e\u0440 \u0438 \u043d\u0435\u0438\u0437\u043c\u0435\u043d\u044f\u0435\u043c\u044b\u0439 \u043e\u0440\u0438\u0433\u0438\u043d\u0430\u043b"], ["chromium", "deals-board.spec.ts", "drag-and-drop: \u0441\u043c\u0435\u043d\u0430 \u0441\u0442\u0430\u0434\u0438\u0438 \u043f\u0435\u0440\u0435\u0442\u0430\u0441\u043a\u0438\u0432\u0430\u043d\u0438\u0435\u043c"], ["chromium", "navigation.spec.ts", "\u043d\u0430\u0432\u0438\u0433\u0430\u0446\u0438\u044f: \u043f\u0430\u043d\u0435\u043b\u044c \u0432\u043b\u0430\u0434\u0435\u043b\u044c\u0446\u0430 \u2192 ERP-\u043c\u043e\u0434\u0443\u043b\u044c"], ["chromium", "procurement-deadlines.spec.ts", "\u0441\u0440\u043e\u043a \u043a\u043b\u0438\u0435\u043d\u0442\u0430 \u043f\u0435\u0440\u0435\u043d\u043e\u0441\u0438\u0442\u0441\u044f \u0432 \u0447\u0435\u0440\u043d\u043e\u0432\u0438\u043a \u043f\u043b\u0430\u043d\u0430 \u0437\u0430\u043a\u0443\u043f\u043a\u0438"], ["setup", "auth.setup.ts", "dev-\u043b\u043e\u0433\u0438\u043d (\u0414\u0438\u0440\u0435\u043a\u0442\u043e\u0440)"]]}
          summary = {'schemaVersion': 1, 'stage': 'preflight', 'passed': False,
                     'planned': 10, 'diagnosticOnly': False, 'passedCount': 0, 'failedCount': 0, 'notRunCount': 10,
                     'globalErrorCount': 0, 'countsKnown': True, 'cases': [], 'sourceVerifiedAfter': False,
                     'cleanupDeferredToHostedJobTeardown': True}

          def git(*args):
              return subprocess.check_output(['git', *args], cwd=root, text=True).strip()

          def verify_sources():
              assert git('rev-parse', 'HEAD') == os.environ['GITHUB_SHA']
              subprocess.run(['git', 'diff', '--quiet', 'HEAD', '--ignore-submodules=untracked'],
                             cwd=root, check=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              for name, expected in expected_sources.items():
                  assert hashlib.sha256((root / name).read_bytes()).hexdigest() == expected
              for name, expected in expected_modules.items():
                  assert git('-C', f'modules/{name}', 'rev-parse', 'HEAD') == expected

          def cases(report):
              result = []
              def walk(suite):
                  for spec in suite.get('specs', []):
                      for test in spec.get('tests', []):
                          stable = (test['projectId'], Path(spec['file']).name, spec['title'])
                          assert stable in expected_cases
                          identity = test['projectId'] + ':' + spec['id']
                          assert re.fullmatch(r'(setup|chromium):[a-f0-9]{20}-[a-f0-9]{20}', identity)
                          result.append((stable, identity, test))
                  for child in suite.get('suites', []):
                      walk(child)
              for suite in report.get('suites', []):
                  walk(suite)
              assert len(result) == 10 and len({r[0] for r in result}) == 10
              assert {r[0] for r in result} == expected_cases
              return result

          def diagnose(result, status):
              error = result.get('error', {})
              if not isinstance(error, dict):
                  error = {}
              message = error.get('message', '')
              first_line = message.splitlines()[0] if isinstance(message, str) and message else ''
              actions = ('Create synthetic MDM counterparty', 'Resolve synthetic MDM-linked CRM client',
                         'Create synthetic MDM-linked CRM deal', 'Link CRM client to selected MDM counterparty',
                         'Create deal from selected MDM counterparty', 'Create deal item through the UI',
                         'Read back UI-created deal item', 'Create synthetic seller profile')
              match = re.match(r'^(?:Error: )?(?:' + '|'.join(map(re.escape, actions))
                               + r'): HTTP ([1-5][0-9]{2})(?![0-9])', first_line)
              http_status = int(match[1]) if match else None
              category = ('http_status' if http_status is not None else
                          'timeout' if status == 'timedOut' else
                          'interrupted' if status == 'interrupted' else 'unknown')
              sources = ('frontend/e2e/crm-own-cycle.spec.ts', 'frontend/e2e/crm-fixtures.ts',
                         'frontend/e2e/auth.setup.ts')
              forms = {form: index for index, name in enumerate(sources)
                       for form in (str(root / name), name, name.removeprefix('frontend/'))}
              limits = {index: len((root / name).read_text(encoding='utf-8').splitlines())
                        for index, name in enumerate(sources)}
              locations = []
              def add(file, line, column):
                  index = forms.get(file) if isinstance(file, str) else None
                  if (index is not None and type(line) is int and type(column) is int
                          and 1 <= line <= limits[index] and 1 <= column <= 4096):
                      value = {'sourceId': index, 'line': line, 'column': column}
                      if value not in locations and len(locations) < 3:
                          locations.append(value)
              location = error.get('location')
              if isinstance(location, dict):
                  add(location.get('file'), location.get('line'), location.get('column'))
              stack = error.get('stack', '')
              if isinstance(stack, str):
                  pattern = (r'^[ \t]*at[ \t]+(?:[^\r\n()]+[ \t]+\()?(' + '|'.join(map(re.escape, forms))
                             + r'):([0-9]{1,4}):([0-9]{1,4})\)?[ \t]*$')
                  for frame in re.finditer(pattern, stack, re.MULTILINE):
                      add(frame[1], int(frame[2]), int(frame[3]))
              return {'category': category, 'httpStatus': http_status, 'locations': locations}

          def last_checkpoint(result):
              annotations = result.get('annotations', [])
              assert isinstance(annotations, list)
              count = 0
              for annotation in annotations:
                  assert isinstance(annotation, dict) and isinstance(annotation.get('type'), str)
                  if annotation['type'] != 'erp_ready_checkpoint':
                      continue
                  count += 1
                  value = annotation.get('description')
                  assert count <= 20 and type(value) is str and value == str(count)
              return count or None

          def capture(command, name, timeout):
              with (temp / (name + '.json')).open('wb') as out, (temp / (name + '.stderr')).open('wb') as err:
                  # This one attempt has a disposable hosted VM; accept only a terminal job.
                  return subprocess.run(command, cwd=root / 'frontend', stdout=out, stderr=err,
                                        timeout=timeout, check=False).returncode

          code = 1
          try:
              verify_sources()
              assert not (root / 'e2e.db').exists()
              for directory in (root, root / 'frontend'):
                  assert not any((directory / name).exists() for name in
                                 ('.env', '.env.local', '.env.development', '.env.development.local',
                                  '.env.production', '.env.production.local', '.env.test', '.env.test.local'))
              import weasyprint
              assert weasyprint.__version__ == '70.0'
              assert weasyprint.HTML(string='<p>QA</p>').write_pdf().startswith(b'%PDF-')
              summary['weasyprintVersion'] = '70.0'
              summary['commit'] = git('rev-parse', 'HEAD')
              summary['sourceSha256'] = expected_sources
              summary['moduleSha'] = expected_modules
              selected = ['e2e/crm-own-outcomes.spec.ts', 'e2e/deal-card.spec.ts', 'e2e/deals-board.spec.ts', 'e2e/navigation.spec.ts', 'e2e/procurement-deadlines.spec.ts']
              command = ['node', 'node_modules/@playwright/test/cli.js', 'test', *selected,
                         '--project=chromium', '--workers=1', '--retries=0', '--max-failures=1',
                         '--trace=off', '--reporter=json', '--grep-invert', 'фильтры: приоритет и «Только висяки»|переключение воронки']
              summary['stage'] = 'collection'
              assert capture([*command, '--list'], 'erp-ready-collection', 90) == 0
              listing = json.loads((temp / 'erp-ready-collection.json').read_text())
              assert not listing.get('errors')
              collected = cases(listing)
              collected_ids = {entry[1] for entry in collected}
              summary['collectedIds'] = sorted(collected_ids)
              summary['stage'] = 'execution'
              summary.update(countsKnown=False, passedCount=None, failedCount=None,
                             notRunCount=None, globalErrorCount=None)
              execution_code = capture(command, 'erp-ready-result', 900)
              report = json.loads((temp / 'erp-ready-result.json').read_text())
              executed = cases(report)
              assert {entry[1] for entry in executed} == collected_ids
              global_error_count = len(report.get('errors', []))
              duration_ms = int(report['stats']['duration'])
              result_cases = []
              for stable, identity, test in executed:
                  results = test.get('results', [])
                  assert test.get('expectedStatus') == 'passed'
                  assert len(results) <= 1
                  if not results or results[0]['status'] == 'skipped':
                      status = 'not_run'
                  else:
                      assert results[0].get('retry', 0) == 0
                      status = results[0]['status']
                      assert status in ('passed', 'failed', 'timedOut', 'interrupted')
                  value = {'id': identity, 'status': status}
                  if status in ('failed', 'timedOut', 'interrupted'):
                      value['diagnostic'] = diagnose(results[0], status)
                      if stable[1] == 'crm-own-cycle.spec.ts':
                          value['diagnostic']['lastCheckpointId'] = last_checkpoint(results[0])
                  result_cases.append(value)
              passed_count = sum(c['status'] == 'passed' for c in result_cases)
              not_run_count = sum(c['status'] == 'not_run' for c in result_cases)
              summary.update(cases=result_cases, passedCount=passed_count, notRunCount=not_run_count,
                             failedCount=10 - passed_count - not_run_count, countsKnown=True,
                             globalErrorCount=global_error_count, durationMs=duration_ms)
              summary['passed'] = execution_code == 0 and summary['passedCount'] == 10 and summary['globalErrorCount'] == 0
              summary['stage'] = 'completed'
              code = 0 if summary['passed'] else 1
          except Exception:
              # Exception bodies can contain data or cookies. Only fixed stage/status is exported.
              summary['passed'] = False
          finally:
              try:
                  verify_sources()
                  summary['sourceVerifiedAfter'] = True
              except Exception:
                  summary['passed'] = False
                  code = 1
              summary_path.write_text(json.dumps(summary, sort_keys=True) + '\n', encoding='utf-8')
              print('Selective E2E stage:', summary['stage'], 'passed:', summary['passedCount'],
                    'failed:', summary['failedCount'], 'not run:', summary['notRunCount'])
          sys.exit(code)
      - name: Upload allowlisted numerical E2E summary only
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: erp-ready-selective-e2e-summary
          path: ${{ runner.temp }}/erp-ready-e2e-summary.json
          if-no-files-found: error
          retention-days: 7

  eschf_pg:
    name: ESCHF first API closed HTTP diagnostic (1)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      eschf-postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: eschf_test
          POSTGRES_PASSWORD: eschf_test
          POSTGRES_DB: eschf_g04_test
        ports:
          - "15439:5432"
        options: >-
          --health-cmd "pg_isready -U eschf_test -d eschf_g04_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      AIOS_ENVIRONMENT: dev
      AIOS_DATABASE_URL: postgresql+psycopg://eschf_test:eschf_test@127.0.0.1:15439/eschf_g04_test
      ESCHF_TEST_DATABASE_URL: postgresql+psycopg://eschf_test:eschf_test@127.0.0.1:15439/eschf_g04_test
      AIOS_SALES_EMAIL_ENABLED: 'false'
      AIOS_AI_ENABLED: 'false'
      AIOS_SMTP_HOST: ''
      AIOS_SMTP_USER: ''
      AIOS_SMTP_PASSWORD: ''
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install existing backend dependencies
        run: pip install -r requirements-dev.txt
      - name: Verify isolated ESCHF source and freshness cases
        shell: python
        run: |
          import hashlib
          import json
          import os
          import re
          import subprocess
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          EXPECTED_SOURCES = {'tests/eschf/test_source_postgres.py': 'dcf05931917cca4aadcbf857ada8dc3bc41cf1c03bede1a768b5abc6ffd95128', 'tests/eschf/test_freshness_postgres.py': '041ea6042d5789c419b576e36d6607b39bb74343b494978a1467218ba74ce94b', 'tests/eschf/test_repository_postgres.py': '74fb84bef7e87e66471d15192e7468e19fd884d500d4c9fb926aff254ee4caad', 'migrations/versions/0121_eschf_durable_state.py': '0f0700b64de476426361041d005ce25a76b392a4ddb72af2f4a52d3c5eb7fee2'}
          EXPECTED_MODULES = {'finance': '59832b2f14a2ee02d8db266a67f8206616bdcd94', 'hr': 'f8a6e0142f1920b07ec56818f42d156a602ff9c3', 'leads': '9a304f771ba74369ded199168e0e1da3ad6348d2', 'logistics': '6923d2e021980ef2546f382364d38dc34a0fef29', 'marketing': 'd4ed67fdc9b41e7abc370112e1a3fa8a3fe1e282', 'procurement': 'f29ea84bd13342ae572e8c4499031d2f053d3d47', 'production': 'be7d7e198bf09cc41c642d22125db401da5adc48', 'sales': '37b3b1d752fe5b16d89ae01a535dc84360ac7591', 'service': '3d33800c44865cd7a7373b29192c5d59d3c4bec8', 'wms': '8b6fb881a03f1a268f07e65f4fa89d195fc933a2'}
          EXPECTED_CASES = {'b3d06cca2541f6975043aa91c8978188935ecdc33d375a26e2be5fc294574fda'}
          FILES = ('tests/eschf/test_source_postgres.py', 'tests/eschf/test_freshness_postgres.py')
          CLASSES = {'tests.eschf.test_source_postgres': FILES[0],
                     'tests.eschf.test_freshness_postgres': FILES[1]}
          PLANNED = 1
          SELECTED = ('tests/eschf/test_source_postgres.py::test_real_source_to_authenticated_mapping_to_durable_snapshot',)

          EXCEPTION_IDS = {'AssertionError': 1, 'FileNotFoundError': 2, 'ModuleNotFoundError': 3, 'AttributeError': 4, 'TypeError': 5, 'KeyError': 6, 'sqlalchemy.exc.IntegrityError': 7, 'sqlalchemy.exc.ProgrammingError': 8, 'sqlalchemy.exc.OperationalError': 9, 'TimeoutError': 10}
          DIAGNOSTIC_SOURCES = {'tests/eschf/test_source_postgres.py': (1, 597), 'tests/eschf/test_repository_postgres.py': (2, 915), 'migrations/versions/0121_eschf_durable_state.py': (3, 381)}
          CHECKOUT_ROOT = str(Path.cwd())


          def collection(data):
              ids = [line for line in data.decode('utf-8').splitlines()
                     if '::' in line]
              assert len(ids) == len(set(ids)) == PLANNED
              assert {hashlib.sha256(value.encode()).hexdigest() for value in ids} == EXPECTED_CASES
              return set(ids)



          def diagnostic(node):
              payload = node.attrib.get('message', '') + '\n' + (node.text or '')
              classes = {code for name, code in EXCEPTION_IDS.items()
                         if re.search(r'^(?:E[ \t]+)?' + re.escape(name) + r'(?::|$)', payload, re.M)}
              frames = []
              suffix = r'(?:in [A-Za-z_][A-Za-z_0-9.<>]*|' + '|'.join(map(re.escape, EXCEPTION_IDS)) + ')'
              for line in payload.splitlines():
                  for filename, (source_id, limit) in DIAGNOSTIC_SOURCES.items():
                      paths = '(?:' + re.escape(filename) + '|' + re.escape(CHECKOUT_ROOT + '/' + filename) + ')'
                      match = re.fullmatch(paths + r':([1-9][0-9]{0,5}): ' + suffix, line.strip())
                      if match and 0 < int(match[1]) <= limit:
                          frame = {'sourceId': source_id, 'line': int(match[1])}
                          if frame not in frames and len(frames) < 3:
                              frames.append(frame)
              class_id = next(iter(classes)) if len(classes) == 1 else 0
              http_status = None
              trace = node.text or ''
              filename = 'tests/eschf/test_source_postgres.py'
              paths = '(?:' + re.escape(filename) + '|' + re.escape(CHECKOUT_ROOT + '/' + filename) + ')'
              known_frame = paths + r':310: (?:in test_real_source_to_authenticated_mapping_to_durable_snapshot|AssertionError)'
              if class_id == 1 and re.search('^' + known_frame + '$', trace, re.M):
                  comparisons = set(re.findall(r'^E[ \t]+assert ([0-9]+) == 201$', trace, re.M))
                  response_codes = set(re.findall(
                      r"^E[ \t]+\+[ \t]+where ([0-9]+) = <Response \[\1(?: [A-Za-z ':-]{1,64})?\]>\.status_code$",
                      trace, re.M))
                  if len(comparisons) == len(response_codes) == 1 and comparisons == response_codes:
                      candidate = next(iter(comparisons))
                      if re.fullmatch(r'[1-5][0-9]{2}', candidate):
                          http_status = int(candidate)
              return {'classId': class_id, 'frames': frames, 'httpStatus': http_status}


          def results(data, collected, returncode):
              assert type(returncode) is int and returncode in (0, 1)
              root = ET.fromstring(data)
              assert root.tag in {'testsuites', 'testsuite'}
              cases = list(root.iter('testcase'))
              assert 0 < len(cases) <= PLANNED
              seen, output = set(), []
              for case in cases:
                  filename = CLASSES[case.attrib['classname']]
                  identity = filename + '::' + case.attrib['name']
                  assert identity in collected and identity not in seen
                  seen.add(identity)
                  statuses = [tag for tag in ('failure', 'error', 'skipped')
                              if case.find(tag) is not None]
                  assert len(statuses) <= 1
                  assert sum(child.tag in {'failure', 'error', 'skipped'} for child in case) == len(statuses)
                  status = {'failure': 'failed', 'error': 'error', 'skipped': 'skipped'}.get(
                      statuses[0] if statuses else '', 'passed')
                  entry = {'id': hashlib.sha256(identity.encode()).hexdigest(), 'status': status}
                  if status in {'failed', 'error'}:
                      entry['diagnostic'] = diagnostic(case.find(statuses[0]))
                  output.append(entry)
              for tag in ('failure', 'error', 'skipped'):
                  assert len(list(root.iter(tag))) == sum(case.find(tag) is not None for case in cases)
              failures = sum(c['status'] in {'failed', 'error'} for c in output)
              if returncode == 0:
                  assert len(output) == PLANNED and failures == 0
              else:
                  assert failures > 0
              return {'countsKnown': True, 'passedCount': sum(c['status'] == 'passed' for c in output),
                      'failedCount': sum(c['status'] == 'failed' for c in output),
                      'errorCount': sum(c['status'] == 'error' for c in output),
                      'skippedCount': sum(c['status'] == 'skipped' for c in output),
                      'notRunCount': PLANNED - len(output), 'cases': output}


          def verify_sources(root):
              def git(*args):
                  return subprocess.check_output(['git', *args], cwd=root, text=True).strip()
              assert git('rev-parse', 'HEAD') == os.environ['GITHUB_SHA']
              subprocess.run(['git', 'diff', '--quiet', 'HEAD', '--ignore-submodules=untracked'],
                             cwd=root, check=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              for filename, expected in EXPECTED_SOURCES.items():
                  assert hashlib.sha256((root / filename).read_bytes()).hexdigest() == expected
              for name, expected in EXPECTED_MODULES.items():
                  assert git('-C', 'modules/' + name, 'rev-parse', 'HEAD') == expected


          def pg_snapshot():
              import psycopg
              expected = 'postgresql+psycopg://eschf_test:eschf_test@127.0.0.1:15439/eschf_g04_test'
              assert os.environ['ESCHF_TEST_DATABASE_URL'] == os.environ['AIOS_DATABASE_URL'] == expected
              with psycopg.connect(expected.replace('postgresql+psycopg://', 'postgresql://', 1),
                                   connect_timeout=10, options='-c statement_timeout=5000') as connection:
                  connection.execute('SET TRANSACTION READ ONLY')
                  database, actor, version = connection.execute(
                      "SELECT current_database(), current_user, current_setting('server_version_num')::int"
                  ).fetchone()
                  assert database == 'eschf_g04_test' and actor == 'eschf_test'
                  assert type(version) is int and 160000 <= version < 170000
                  schemas = connection.execute(
                      "SELECT count(*) FROM pg_namespace WHERE nspname = 'eschf' "
                      "OR nspname LIKE 'eschf_source_fixture_%'"
                  ).fetchone()[0]
                  locks = connection.execute(
                      "SELECT count(*) FROM pg_locks WHERE locktype = 'advisory' "
                      'AND classid = 0 AND objid = 904121 AND granted'
                  ).fetchone()[0]
                  return version, schemas == 0 and locks == 0


          def main():
              root, temp = Path.cwd(), Path(os.environ['RUNNER_TEMP'])
              summary = {'schemaVersion': 1, 'kind': 'eschf-pg1-http-diagnostic', 'stage': 'preflight',
                         'passed': False, 'planned': PLANNED, 'countsKnown': False,
                         'passedCount': None, 'failedCount': None, 'errorCount': None,
                         'skippedCount': None, 'notRunCount': None, 'cases': [],
                         'sourceVerifiedAfter': False, 'postflightSchemaClean': False,
                         'cleanupDeferredToHostedJobTeardown': True}
              code = 1
              try:
                  verify_sources(root)
                  for directory in (root, root / 'frontend'):
                      assert not any((directory / name).exists() for name in (
                          '.env', '.env.local', '.env.development', '.env.development.local',
                          '.env.production', '.env.production.local', '.env.test', '.env.test.local'))
                  assert os.environ['AIOS_ENVIRONMENT'] == 'dev'
                  assert os.environ['AIOS_SALES_EMAIL_ENABLED'] == os.environ['AIOS_AI_ENABLED'] == 'false'
                  assert all(os.environ[name] == '' for name in (
                      'AIOS_SMTP_HOST', 'AIOS_SMTP_USER', 'AIOS_SMTP_PASSWORD'))
                  version, clean = pg_snapshot()
                  assert clean
                  summary.update(commit=os.environ['GITHUB_SHA'], sourceSha256=EXPECTED_SOURCES,
                                 moduleSha=EXPECTED_MODULES, postgresVersion=version)
                  summary['stage'] = 'collection'
                  with (temp / 'eschf-collection.log').open('wb') as log:
                      collected = subprocess.run([sys.executable, '-m', 'pytest', '--color=no', '--collect-only', '-q', *SELECTED],
                                                 stdout=log, stderr=subprocess.STDOUT, timeout=90)
                  assert collected.returncode == 0
                  identities = collection((temp / 'eschf-collection.log').read_bytes())
                  summary['collectedIds'] = sorted(EXPECTED_CASES)
                  summary['stage'] = 'execution'
                  junit = temp / 'eschf-pg.junit.xml'
                  with (temp / 'eschf-execution.log').open('wb') as log:
                      completed = subprocess.run([sys.executable, '-m', 'pytest', '--color=no', '-q', '-x', '--tb=short',
                                                  '--junitxml=' + str(junit), *SELECTED],
                                                 stdout=log, stderr=subprocess.STDOUT, timeout=900)
                  numbers = results(junit.read_bytes(), identities, completed.returncode)
                  summary.update(numbers)
                  summary['stage'] = 'completed'
                  summary['passed'] = completed.returncode == 0 and numbers['passedCount'] == PLANNED
                  code = 0 if summary['passed'] else 1
              except Exception:
                  summary['stage'] = 'hold'
                  summary['passed'] = False
              finally:
                  try:
                      verify_sources(root)
                      summary['sourceVerifiedAfter'] = True
                  except Exception:
                      summary['passed'] = False
                  try:
                      version, clean = pg_snapshot()
                      summary['postflightSchemaClean'] = clean
                      summary['postgresVersion'] = version
                      if not clean:
                          summary['passed'] = False
                  except Exception:
                      summary['passed'] = False
                  if not summary['passed']:
                      code = 1
                  (temp / 'erp-ready-eschf-summary.json').write_text(json.dumps(summary, sort_keys=True) + '\n')
                  print('ESCHF stage:', summary['stage'], 'passed:', summary['passedCount'],
                        'failed:', summary['failedCount'], 'not run:', summary['notRunCount'])
              return code


          if __name__ == '__main__':
              sys.exit(main())
      - name: Upload allowlisted numerical ESCHF summary only
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: erp-ready-selective-eschf-summary
          path: ${{ runner.temp }}/erp-ready-eschf-summary.json
          if-no-files-found: error
          retention-days: 7
