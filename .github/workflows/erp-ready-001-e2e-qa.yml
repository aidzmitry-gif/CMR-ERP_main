a9a57d9fc', '2dfc477d3ca20be5055e7f937eff1b0b81b2c29e75e818499909133ad76f4176'}
          FILES = ('tests/eschf/test_source_postgres.py', 'tests/eschf/test_freshness_postgres.py')
          CLASSES = {'tests.eschf.test_source_postgres': FILES[0],
                     'tests.eschf.test_freshness_postgres': FILES[1]}
          PLANNED = 89
          SELECTED = ('tests/eschf/test_source_postgres.py', 'tests/eschf/test_freshness_postgres.py')

          EXCEPTION_IDS = {'AssertionError': 1, 'FileNotFoundError': 2, 'ModuleNotFoundError': 3, 'AttributeError': 4, 'TypeError': 5, 'KeyError': 6, 'sqlalchemy.exc.IntegrityError': 7, 'sqlalchemy.exc.ProgrammingError': 8, 'sqlalchemy.exc.OperationalError': 9, 'TimeoutError': 10}
          DIAGNOSTIC_SOURCES = {'tests/eschf/test_source_postgres.py': (1, 602), 'tests/eschf/test_repository_postgres.py': (2, 915), 'migrations/versions/0121_eschf_durable_state.py': (3, 381)}
          CHECKOUT_ROOT = str(Path.cwd())


          def collection(data):
              ids = [line for line in data.decode('utf-8').splitlines()
                     if '::' in line]
              assert len(ids) == len(set(ids)) == PLANNED
              assert {hashlib.sha256(value.encode()).hexdigest() for value in ids} == EXPECTED_CASES
              return set(ids)



          def diagnostic(node):
              payload = node.attrib.get('message', '') + '\n' + (node.text or '')
              classes = {code for name, code in EXCEPTION_IDS.items()
                         if re.search(r'^(?:E[ \t]+)?' + re.escape(name) + r'(?::|$)', payload, re.M)}
              frames = []
              suffix = r'(?:in [A-Za-z_][A-Za-z_0-9.<>]*|' + '|'.join(map(re.escape, EXCEPTION_IDS)) + ')'
              for line in payload.splitlines():
                  for filename, (source_id, limit) in DIAGNOSTIC_SOURCES.items():
                      paths = '(?:' + re.escape(filename) + '|' + re.escape(CHECKOUT_ROOT + '/' + filename) + ')'
                      match = re.fullmatch(paths + r':([1-9][0-9]{0,5}): ' + suffix, line.strip())
                      if match and 0 < int(match[1]) <= limit:
                          frame = {'sourceId': source_id, 'line': int(match[1])}
                          if frame not in frames and len(frames) < 3:
                              frames.append(frame)
              class_id = next(iter(classes)) if len(classes) == 1 else 0
              http_status = None
              trace = node.text or ''
              filename = 'tests/eschf/test_source_postgres.py'
              paths = '(?:' + re.escape(filename) + '|' + re.escape(CHECKOUT_ROOT + '/' + filename) + ')'
              known_frame = paths + r':314: (?:in test_real_source_to_authenticated_mapping_to_durable_snapshot|AssertionError)'
              if class_id == 1 and re.search('^' + known_frame + '$', trace, re.M):
                  comparisons = set(re.findall(r'^E[ \t]+assert ([0-9]+) == 201$', trace, re.M))
                  response_codes = set(re.findall(
                      r"^E[ \t]+\+[ \t]+where ([0-9]+) = <Response \[\1(?: [A-Za-z ':-]{1,64})?\]>\.status_code$",
                      trace, re.M))
                  if len(comparisons) == len(response_codes) == 1 and comparisons == response_codes:
                      candidate = next(iter(comparisons))
                      if re.fullmatch(r'[1-5][0-9]{2}', candidate):
                          http_status = int(candidate)
              return {'classId': class_id, 'frames': frames, 'httpStatus': http_status}


          def results(data, collected, returncode):
              assert type(returncode) is int and returncode in (0, 1)
              root = ET.fromstring(data)
              assert root.tag in {'testsuites', 'testsuite'}
              cases = list(root.iter('testcase'))
              assert 0 < len(cases) <= PLANNED
              seen, output = set(), []
              for case in cases:
                  filename = CLASSES[case.attrib['classname']]
                  identity = filename + '::' + case.attrib['name']
                  assert identity in collected and identity not in seen
                  seen.add(identity)
                  statuses = [tag for tag in ('failure', 'error', 'skipped')
                              if case.find(tag) is not None]
                  assert len(statuses) <= 1
                  assert sum(child.tag in {'failure', 'error', 'skipped'} for child in case) == len(statuses)
                  status = {'failure': 'failed', 'error': 'error', 'skipped': 'skipped'}.get(
                      statuses[0] if statuses else '', 'passed')
                  entry = {'id': hashlib.sha256(identity.encode()).hexdigest(), 'status': status}
                  if status in {'failed', 'error'}:
                      entry['diagnostic'] = diagnostic(case.find(statuses[0]))
                  output.append(entry)
              for tag in ('failure', 'error', 'skipped'):
                  assert len(list(root.iter(tag))) == sum(case.find(tag) is not None for case in cases)
              failures = sum(c['status'] in {'failed', 'error'} for c in output)
              if returncode == 0:
                  assert len(output) == PLANNED and failures == 0
              else:
                  assert failures > 0
              return {'countsKnown': True, 'passedCount': sum(c['status'] == 'passed' for c in output),
                      'failedCount': sum(c['status'] == 'failed' for c in output),
                      'errorCount': sum(c['status'] == 'error' for c in output),
                      'skippedCount': sum(c['status'] == 'skipped' for c in output),
                      'notRunCount': PLANNED - len(output), 'cases': output}


          def verify_sources(root):
              def git(*args):
                  return subprocess.check_output(['git', *args], cwd=root, text=True).strip()
              assert git('rev-parse', 'HEAD') == os.environ['GITHUB_SHA']
              subprocess.run(['git', 'diff', '--quiet', 'HEAD', '--ignore-submodules=untracked'],
                             cwd=root, check=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              for filename, expected in EXPECTED_SOURCES.items():
                  assert hashlib.sha256((root / filename).read_bytes()).hexdigest() == expected
              for name, expected in EXPECTED_MODULES.items():
                  assert git('-C', 'modules/' + name, 'rev-parse', 'HEAD') == expected


          def pg_snapshot():
              import psycopg
              expected = 'postgresql+psycopg://eschf_test:eschf_test@127.0.0.1:15439/eschf_g04_test'
              assert os.environ['ESCHF_TEST_DATABASE_URL'] == os.environ['AIOS_DATABASE_URL'] == expected
              with psycopg.connect(expected.replace('postgresql+psycopg://', 'postgresql://', 1),
                                   connect_timeout=10, options='-c statement_timeout=5000') as connection:
                  connection.execute('SET TRANSACTION READ ONLY')
                  database, actor, version = connection.execute(
                      "SELECT current_database(), current_user, current_setting('server_version_num')::int"
                  ).fetchone()
                  assert database == 'eschf_g04_test' and actor == 'eschf_test'
                  assert type(version) is int and 160000 <= version < 170000
                  schemas = connection.execute(
                      "SELECT count(*) FROM pg_namespace WHERE nspname = 'eschf' "
                      "OR nspname LIKE 'eschf_source_fixture_%'"
                  ).fetchone()[0]
                  locks = connection.execute(
                      "SELECT count(*) FROM pg_locks WHERE locktype = 'advisory' "
                      'AND classid = 0 AND objid = 904121 AND granted'
                  ).fetchone()[0]
                  return version, schemas == 0 and locks == 0


          def main():
              root, temp = Path.cwd(), Path(os.environ['RUNNER_TEMP'])
              summary = {'schemaVersion': 1, 'kind': 'eschf-pg89-persistent-role', 'stage': 'preflight',
                         'passed': False, 'planned': PLANNED, 'countsKnown': False,
                         'passedCount': None, 'failedCount': None, 'errorCount': None,
                         'skippedCount': None, 'notRunCount': None, 'cases': [],
                         'sourceVerifiedAfter': False, 'postflightSchemaClean': False,
                         'cleanupDeferredToHostedJobTeardown': True}
              code = 1
              try:
                  verify_sources(root)
                  for directory in (root, root / 'frontend'):
                      assert not any((directory / name).exists() for name in (
                          '.env', '.env.local', '.env.development', '.env.development.local',
                          '.env.production', '.env.production.local', '.env.test', '.env.test.local'))
                  assert os.environ['AIOS_ENVIRONMENT'] == 'dev'
                  assert os.environ['AIOS_SALES_EMAIL_ENABLED'] == os.environ['AIOS_AI_ENABLED'] == 'false'
                  assert all(os.environ[name] == '' for name in (
                      'AIOS_SMTP_HOST', 'AIOS_SMTP_USER', 'AIOS_SMTP_PASSWORD'))
                  version, clean = pg_snapshot()
                  assert clean
                  summary.update(commit=os.environ['GITHUB_SHA'], sourceSha256=EXPECTED_SOURCES,
                                 moduleSha=EXPECTED_MODULES, postgresVersion=version)
                  summary['stage'] = 'collection'
                  with (temp / 'eschf-collection.log').open('wb') as log:
                      collected = subprocess.run([sys.executable, '-m', 'pytest', '--color=no', '--collect-only', '-q', *SELECTED],
                                                 stdout=log, stderr=subprocess.STDOUT, timeout=90)
                  assert collected.returncode == 0
                  identities = collection((temp / 'eschf-collection.log').read_bytes())
                  summary['collectedIds'] = sorted(EXPECTED_CASES)
                  summary['stage'] = 'execution'
                  junit = temp / 'eschf-pg.junit.xml'
                  with (temp / 'eschf-execution.log').open('wb') as log:
                      completed = subprocess.run([sys.executable, '-m', 'pytest', '--color=no', '-q', '-x', '--tb=short',
                                                  '--junitxml=' + str(junit), *SELECTED],
                                                 stdout=log, stderr=subprocess.STDOUT, timeout=900)
                  numbers = results(junit.read_bytes(), identities, completed.returncode)
                  summary.update(numbers)
                  summary['stage'] = 'completed'
                  summary['passed'] = completed.returncode == 0 and numbers['passedCount'] == PLANNED
                  code = 0 if summary['passed'] else 1
              except Exception:
                  summary['stage'] = 'hold'
                  summary['passed'] = False
              finally:
                  try:
                      verify_sources(root)
                      summary['sourceVerifiedAfter'] = True
                  except Exception:
                      summary['passed'] = False
                  try:
                      version, clean = pg_snapshot()
                      summary['postflightSchemaClean'] = clean
                      summary['postgresVersion'] = version
                      if not clean:
                          summary['passed'] = False
                  except Exception:
                      summary['passed'] = False
                  if not summary['passed']:
                      code = 1
                  (temp / 'erp-ready-eschf-summary.json').write_text(json.dumps(summary, sort_keys=True) + '\n')
                  print('ESCHF stage:', summary['stage'], 'passed:', summary['passedCount'],
                        'failed:', summary['failedCount'], 'not run:', summary['notRunCount'])
              return code


          if __name__ == '__main__':
              sys.exit(main())
      - name: Upload allowlisted numerical ESCHF summary only
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: erp-ready-selective-eschf-summary
          path: ${{ runner.temp }}/erp-ready-eschf-summary.json
          if-no-files-found: error
          retention-days: 7

