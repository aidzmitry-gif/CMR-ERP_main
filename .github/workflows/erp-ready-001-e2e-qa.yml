name: ERP-READY selective E2E QA

on:
  push:
    branches:
      - "agent/erp-ready-001-e2e-20261017"

permissions:
  contents: read

jobs:
  e2e:
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install backend deps
        run: pip install -r requirements-dev.txt
      - name: Native dependencies for immutable document PDFs
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu-core
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Install Playwright (chromium)
        working-directory: frontend
        run: npx --no-install playwright install --with-deps chromium
      - name: Native PDF and stock-outcome diagnostic
        shell: python
        run: |
          import hashlib
          import json
          import os
          import re
          import subprocess
          import sys
          from pathlib import Path

          root = Path.cwd()
          temp = Path(os.environ['RUNNER_TEMP'])
          summary_path = temp / 'erp-ready-e2e-summary.json'
          expected_sources = {'frontend/e2e/counterparties.spec.ts': '27e7b1bae0477a983c21a8a215d237f1361c62e61e4bd01615b4b0adb660501e', 'frontend/e2e/crm-own-cycle.spec.ts': '2abbcecd942765f164eec448ce6737f39e9e152012151a8cdd3f0e4b2458a6f1', 'frontend/e2e/crm-own-outcomes.spec.ts': 'f923b2d96023b9d455778e3b6f6afb193fcda5818eb8e9a67dce5ffce403335a', 'frontend/e2e/deal-card.spec.ts': 'bcb66f622e6f54e51437e712c1f8a1327a4bfc6b6c2d6b46b6ad95cfb5621ec9', 'frontend/e2e/deals-board.spec.ts': '694519c4eefda774fb32cb82336e128b0f99f6ab23ae522a32e28e8fcb5df9b8', 'frontend/e2e/navigation.spec.ts': '996b3f56c58b0385b8e180d2bb6b83602cb844c38e4953983e2fa866f371a39f', 'frontend/e2e/procurement-deadlines.spec.ts': '5ffdb586955d4379bbb87bb591b8251116db732f4de53fe32dbb76d59c6a5155', 'frontend/e2e/crm-fixtures.ts': '43be79105c3fa04f1875ef7507e38e56cb5f25800e27d50221c1177100d75f98', 'scripts/seed_invoice_e2e.py': 'c83b6069b25aa6e43924281a7a210c4e065a1a685aa1e5aaaee14e4b68da3281'}
          expected_modules = {'finance': '59832b2f14a2ee02d8db266a67f8206616bdcd94', 'hr': 'f8a6e0142f1920b07ec56818f42d156a602ff9c3', 'leads': '9a304f771ba74369ded199168e0e1da3ad6348d2', 'logistics': '6923d2e021980ef2546f382364d38dc34a0fef29', 'marketing': 'd4ed67fdc9b41e7abc370112e1a3fa8a3fe1e282', 'procurement': 'f29ea84bd13342ae572e8c4499031d2f053d3d47', 'production': 'be7d7e198bf09cc41c642d22125db401da5adc48', 'sales': '37b3b1d752fe5b16d89ae01a535dc84360ac7591', 'service': '3d33800c44865cd7a7373b29192c5d59d3c4bec8', 'wms': '8b6fb881a03f1a268f07e65f4fa89d195fc933a2'}
          expected_cases = {tuple(case) for case in [["chromium", "crm-own-outcomes.spec.ts", "own outcomes preserve originals, tasks and stock reserve"], ["setup", "auth.setup.ts", "dev-\u043b\u043e\u0433\u0438\u043d (\u0414\u0438\u0440\u0435\u043a\u0442\u043e\u0440)"]]}
          summary = {'schemaVersion': 1, 'stage': 'preflight', 'passed': False,
                     'planned': 2, 'diagnosticOnly': True, 'passedCount': 0, 'failedCount': 0, 'notRunCount': 2,
                     'globalErrorCount': 0, 'globalDiagnostics': [], 'countsKnown': True, 'cases': [], 'sourceVerifiedAfter': False,
                     'cleanupDeferredToHostedJobTeardown': True}

          def git(*args):
              return subprocess.check_output(['git', *args], cwd=root, text=True).strip()

          def verify_sources():
              assert git('rev-parse', 'HEAD') == os.environ['GITHUB_SHA']
              subprocess.run(['git', 'diff', '--quiet', 'HEAD', '--ignore-submodules=untracked'],
                             cwd=root, check=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              for name, expected in expected_sources.items():
                  assert hashlib.sha256((root / name).read_bytes()).hexdigest() == expected
              for name, expected in expected_modules.items():
                  assert git('-C', f'modules/{name}', 'rev-parse', 'HEAD') == expected

          def cases(report):
              result = []
              def walk(suite):
                  for spec in suite.get('specs', []):
                      for test in spec.get('tests', []):
                          stable = (test['projectId'], Path(spec['file']).name, spec['title'])
                          assert stable in expected_cases
                          identity = test['projectId'] + ':' + spec['id']
                          assert re.fullmatch(r'(setup|chromium):[a-f0-9]{20}-[a-f0-9]{20}', identity)
                          result.append((stable, identity, test))
                  for child in suite.get('suites', []):
                      walk(child)
              for suite in report.get('suites', []):
                  walk(suite)
              assert len(result) == 2 and len({r[0] for r in result}) == 2
              assert {r[0] for r in result} == expected_cases
              return result

          def diagnose(result, status):
              error = result.get('error', {})
              if not isinstance(error, dict):
                  error = {}
              message = error.get('message', '')
              first_line = message.splitlines()[0] if isinstance(message, str) and message else ''
              actions = ('Create synthetic MDM counterparty', 'Resolve synthetic MDM-linked CRM client',
                         'Create synthetic MDM-linked CRM deal', 'Link CRM client to selected MDM counterparty',
                         'Create deal from selected MDM counterparty', 'Create deal item through the UI',
                         'Read back UI-created deal item', 'Create synthetic seller profile')
              match = re.match(r'^(?:Error: )?(?:' + '|'.join(map(re.escape, actions))
                               + r'): HTTP ([1-5][0-9]{2})(?![0-9])', first_line)
              http_status = int(match[1]) if match else None
              category = ('http_status' if http_status is not None else
                          'timeout' if status == 'timedOut' else
                          'interrupted' if status == 'interrupted' else 'unknown')
              sources = ('frontend/e2e/crm-own-cycle.spec.ts', 'frontend/e2e/crm-fixtures.ts',
                         'frontend/e2e/auth.setup.ts', 'frontend/e2e/crm-own-outcomes.spec.ts')
              forms = {form: index for index, name in enumerate(sources)
                       for form in (str(root / name), name, name.removeprefix('frontend/'))}
              limits = {index: len((root / name).read_text(encoding='utf-8').splitlines())
                        for index, name in enumerate(sources)}
              locations = []
              def add(file, line, column):
                  index = forms.get(file) if isinstance(file, str) else None
                  if (index is not None and type(line) is int and type(column) is int
                          and 1 <= line <= limits[index] and 1 <= column <= 4096):
                      value = {'sourceId': index, 'line': line, 'column': column}
                      if value not in locations and len(locations) < 3:
                          locations.append(value)
              location = error.get('location')
              if isinstance(location, dict):
                  add(location.get('file'), location.get('line'), location.get('column'))
              stack = error.get('stack', '')
              if isinstance(stack, str):
                  pattern = (r'^[ \t]*at[ \t]+(?:[^\r\n()]+[ \t]+\()?(' + '|'.join(map(re.escape, forms))
                             + r'):([0-9]{1,4}):([0-9]{1,4})\)?[ \t]*$')
                  for frame in re.finditer(pattern, stack, re.MULTILINE):
                      add(frame[1], int(frame[2]), int(frame[3]))
              return {'category': category, 'httpStatus': http_status, 'locations': locations}

          def last_checkpoint(result, annotation_type='erp_ready_checkpoint'):
              assert annotation_type in ('erp_ready_checkpoint', 'erp_ready_outcome_checkpoint')
              limit = 26 if annotation_type == 'erp_ready_outcome_checkpoint' else 20
              annotations = result.get('annotations', [])
              assert isinstance(annotations, list)
              count = 0
              for annotation in annotations:
                  assert isinstance(annotation, dict) and isinstance(annotation.get('type'), str)
                  if annotation['type'] != annotation_type:
                      continue
                  count += 1
                  value = annotation.get('description')
                  assert count <= limit and type(value) is str and value == str(count)
              return count or None

          def win_request_statuses(result):
              annotations = result.get('annotations', [])
              assert isinstance(annotations, list)
              selected = []
              for annotation in annotations:
                  assert isinstance(annotation, dict) and isinstance(annotation.get('type'), str)
                  if annotation['type'] == 'erp_ready_win_request':
                      selected.append(annotation.get('description'))
              if not selected:
                  return None
              assert len(selected) == 3
              output = []
              for endpoint_id, value in enumerate(selected, 1):
                  assert type(value) is str
                  match = re.fullmatch(str(endpoint_id) + r':(null|[1-5][0-9]{2})', value)
                  assert match
                  output.append({'endpointId': endpoint_id,
                                 'httpStatus': None if match[1] == 'null' else int(match[1])})
              return output

          def global_diagnostics(errors):
              assert isinstance(errors, list) and all(isinstance(error, dict) for error in errors)
              return [diagnose({'error': error}, 'unknown') for error in errors[:3]]


          def capture(command, name, timeout):
              with (temp / (name + '.json')).open('wb') as out, (temp / (name + '.stderr')).open('wb') as err:
                  # This one attempt has a disposable hosted VM; accept only a terminal job.
                  return subprocess.run(command, cwd=root / 'frontend', stdout=out, stderr=err,
                                        timeout=timeout, check=False).returncode

          code = 1
          try:
              verify_sources()
              assert not (root / 'e2e.db').exists()
              for directory in (root, root / 'frontend'):
                  assert not any((directory / name).exists() for name in
                                 ('.env', '.env.local', '.env.development', '.env.development.local',
                                  '.env.production', '.env.production.local', '.env.test', '.env.test.local'))
              import weasyprint
              assert weasyprint.__version__ == '70.0'
              assert weasyprint.HTML(string='<p>QA</p>').write_pdf().startswith(b'%PDF-')
              summary['weasyprintVersion'] = '70.0'
              summary['commit'] = git('rev-parse', 'HEAD')
              summary['sourceSha256'] = expected_sources
              summary['moduleSha'] = expected_modules
              selected = ['e2e/crm-own-outcomes.spec.ts']
              command = ['node', 'node_modules/@playwright/test/cli.js', 'test', *selected,
                         '--project=chromium', '--workers=1', '--retries=0', '--max-failures=1',
                         '--trace=off', '--reporter=json', '--grep', 'own outcomes preserve originals, tasks and stock reserve$']
              summary['stage'] = 'collection'
              assert capture([*command, '--list'], 'erp-ready-collection', 90) == 0
              listing = json.loads((temp / 'erp-ready-collection.json').read_text())
              assert not listing.get('errors')
              collected = cases(listing)
              collected_ids = {entry[1] for entry in collected}
              summary['collectedIds'] = sorted(collected_ids)
              summary['stage'] = 'execution'
              summary.update(countsKnown=False, passedCount=None, failedCount=None,
                             notRunCount=None, globalErrorCount=None, globalDiagnostics=None)
              execution_code = capture(command, 'erp-ready-result', 900)
              report = json.loads((temp / 'erp-ready-result.json').read_text())
              executed = cases(report)
              assert {entry[1] for entry in executed} == collected_ids
              global_errors = report.get('errors', [])
              duration_ms = int(report['stats']['duration'])
              result_cases = []
              for stable, identity, test in executed:
                  results = test.get('results', [])
                  assert test.get('expectedStatus') == 'passed'
                  assert len(results) <= 1
                  if not results or results[0]['status'] == 'skipped':
                      status = 'not_run'
                  else:
                      assert results[0].get('retry', 0) == 0
                      status = results[0]['status']
                      assert status in ('passed', 'failed', 'timedOut', 'interrupted')
                  value = {'id': identity, 'status': status}
                  if status in ('failed', 'timedOut', 'interrupted'):
                      value['diagnostic'] = diagnose(results[0], status)
                      if stable[1] == 'crm-own-cycle.spec.ts':
                          value['diagnostic']['lastCheckpointId'] = last_checkpoint(results[0])
                      elif stable[1] == 'crm-own-outcomes.spec.ts':
                          value['diagnostic']['lastCheckpointId'] = last_checkpoint(results[0], 'erp_ready_outcome_checkpoint')
                          value['diagnostic']['winRequests'] = win_request_statuses(results[0])
                  result_cases.append(value)
              global_errors_summary = global_diagnostics(global_errors)
              global_error_count = len(global_errors)
              passed_count = sum(c['status'] == 'passed' for c in result_cases)
              not_run_count = sum(c['status'] == 'not_run' for c in result_cases)
              summary.update(cases=result_cases, passedCount=passed_count, notRunCount=not_run_count,
                             failedCount=2 - passed_count - not_run_count, countsKnown=True,
                             globalErrorCount=global_error_count, globalDiagnostics=global_errors_summary, durationMs=duration_ms)
              summary['passed'] = execution_code == 0 and summary['passedCount'] == 2 and summary['globalErrorCount'] == 0
              summary['stage'] = 'completed'
              code = 0 if summary['passed'] else 1
          except Exception:
              # Exception bodies can contain data or cookies. Only fixed stage/status is exported.
              summary['passed'] = False
          finally:
              try:
                  verify_sources()
                  summary['sourceVerifiedAfter'] = True
              except Exception:
                  summary['passed'] = False
                  code = 1
              summary_path.write_text(json.dumps(summary, sort_keys=True) + '\n', encoding='utf-8')
              print('Selective E2E stage:', summary['stage'], 'passed:', summary['passedCount'],
                    'failed:', summary['failedCount'], 'not run:', summary['notRunCount'])
          sys.exit(code)
      - name: Upload allowlisted numerical E2E summary only
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: erp-ready-selective-e2e-summary
          path: ${{ runner.temp }}/erp-ready-e2e-summary.json
          if-no-files-found: error
          retention-days: 7

  eschf_pg:
    if: ${{ false }}
    name: ESCHF source and freshness persisted-role regression (89)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      eschf-postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: eschf_test
          POSTGRES_PASSWORD: eschf_test
          POSTGRES_DB: eschf_g04_test
        ports:
          - "15439:5432"
        options: >-
          --health-cmd "pg_isready -U eschf_test -d eschf_g04_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      AIOS_ENVIRONMENT: dev
      AIOS_DATABASE_URL: postgresql+psycopg://eschf_test:eschf_test@127.0.0.1:15439/eschf_g04_test
      ESCHF_TEST_DATABASE_URL: postgresql+psycopg://eschf_test:eschf_test@127.0.0.1:15439/eschf_g04_test
      AIOS_SALES_EMAIL_ENABLED: 'false'
      AIOS_AI_ENABLED: 'false'
      AIOS_SMTP_HOST: ''
      AIOS_SMTP_USER: ''
      AIOS_SMTP_PASSWORD: ''
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install existing backend dependencies
        run: pip install -r requirements-dev.txt
      - name: Verify isolated ESCHF source and freshness cases
        shell: python
        run: |
          import hashlib
          import json
          import os
          import re
          import subprocess
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          EXPECTED_SOURCES = {'tests/eschf/test_source_postgres.py': 'eefd00e738d6510904edea69dbef48b9692b74cbf7d2cd81d82427fa69ee136a', 'tests/eschf/test_freshness_postgres.py': '161aa2b4dc89a231748329f6b3dc8d3be8536092136ff96dfbf4f2e6a0be54f8', 'tests/eschf/test_repository_postgres.py': '74fb84bef7e87e66471d15192e7468e19fd884d500d4c9fb926aff254ee4caad', 'migrations/versions/0121_eschf_durable_state.py': '0f0700b64de476426361041d005ce25a76b392a4ddb72af2f4a52d3c5eb7fee2'}
