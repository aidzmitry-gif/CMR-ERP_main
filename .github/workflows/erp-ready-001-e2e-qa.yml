a9a57d9fc', '2dfc477d3ca20be5055e7f937eff1b0b81b2c29e75e818499909133ad76f4176'}
          FILES = ('tests/eschf/test_source_postgres.py', 'tests/eschf/test_freshness_postgres.py')
          CLASSES = {'tests.eschf.test_source_postgres': FILES[0],
                     'tests.eschf.test_freshness_postgres': FILES[1]}
          PLANNED = 89
          SELECTED = ('tests/eschf/test_source_postgres.py', 'tests/eschf/test_freshness_postgres.py')

          EXCEPTION_IDS = {'AssertionError': 1, 'FileNotFoundError': 2, 'ModuleNotFoundError': 3, 'AttributeError': 4, 'TypeError': 5, 'KeyError': 6, 'sqlalchemy.exc.IntegrityError': 7, 'sqlalchemy.exc.ProgrammingError': 8, 'sqlalchemy.exc.OperationalError': 9, 'TimeoutError': 10}
          DIAGNOSTIC_SOURCES = {'tests/eschf/test_source_postgres.py': (1, 602), 'tests/eschf/test_repository_postgres.py': (2, 915), 'migrations/versions/0121_eschf_durable_state.py': (3, 381)}
          CHECKOUT_ROOT = str(Path.cwd())


          def collection(data):
              ids = [line for line in data.decode('utf-8').splitlines()
                     if '::' in line]
              assert len(ids) == len(set(ids)) == PLANNED
              assert {hashlib.sha256(value.encode()).hexdigest() for value in ids} == EXPECTED_CASES
              return set(ids)



          def diagnostic(node):
              payload = node.attrib.get('message', '') + '\n' + (node.text or '')
              classes = {code for name, code in EXCEPTION_IDS.items()
                         if re.search(r'^(?:E[ \t]+)?' + re.escape(name) + r'(?::|$)', payload, re.M)}
              frames = []
              suffix = r'(?:in [A-Za-z_][A-Za-z_0-9.<>]*|' + '|'.join(map(re.escape, EXCEPTION_IDS)) + ')'
              for line in payload.splitlines():
                  for filename, (source_id, limit) in DIAGNOSTIC_SOURCES.items():
                      paths = '(?:' + re.escape(filename) + '|' + re.escape(CHECKOUT_ROOT + '/' + filename) + ')'
                      match = re.fullmatch(paths + r':([1-9][0-9]{0,5}): ' + suffix, line.strip())
                      if match and 0 < int(match[1]) <= limit:
                          frame = {'sourceId': source_id, 'line': int(match[1])}
                          if frame not in frames and len(frames) < 3:
                              frames.append(frame)
              class_id = next(iter(classes)) if len(classes) == 1 else 0
              http_status = None
              trace = node.text or ''
              filename = 'tests/eschf/test_source_postgres.py'
              paths = '(?:' + re.escape(filename) + '|' + re.escape(CHECKOUT_ROOT + '/' + filename) + ')'
              known_frame = paths + r':314: (?:in test_real_source_to_authenticated_mapping_to_durable_snapshot|AssertionError)'
              if class_id == 1 and re.search('^' + known_frame + '$', trace, re.M):
                  comparisons = set(re.findall(r'^E[ \t]+assert ([0-9]+) == 201$', trace, re.M))
                  response_codes = set(re.findall(
                      r"^E[ \t]+\+[ \t]+where ([0-9]+) = <Response \[\1(?: [A-Za-z ':-]{1,64})?\]>\.status_code$",
                      trace, re.M))
                  if len(comparisons) == len(response_codes) == 1 and comparisons == response_codes:
                      candidate = next(iter(comparisons))
                      if re.fullmatch(r'[1-5][0-9]{2}', candidate):
                          http_status = int(candidate)
              return {'classId': class_id, 'frames': frames, 'httpStatus': http_status}


          def results(data, collected, returncode):
              assert type(returncode) is int and returncode in (0, 1)
              root = ET.fromstring(data)
              assert root.tag in {'testsuites', 'testsuite'}
              cases = list(root.iter('testcase'))
              assert 0 < len(cases) <= PLANNED
              seen, output = set(), []
              for case in cases:
                  filename = CLASSES[case.attrib['classname']]
                  identity = filename + '::' + case.attrib['name']
                  assert identity in collected and identity not in seen
                  seen.add(identity)
                  statuses = [tag for tag in ('failure', 'error', 'skipped')
                              if case.find(tag) is not None]
                  assert len(statuses) <= 1
                  assert sum(child.tag in {'failure', 'error', 'skipped'} for child in case) == len(statuses)
                  status = {'failure': 'failed', 'error': 'error', 'skipped': 'skipped'}.get(
                      statuses[0] if statuses else '', 'passed')
                  entry = {'id': hashlib.sha256(identity.encode()).hexdigest(), 'status': status}
                  if status in {'failed', 'error'}:
                      entry['diagnostic'] = diagnostic(case.find(statuses[0]))
                  output.append(entry)
              for tag in ('failure', 'error', 'skipped'):
                  assert len(list(root.iter(tag))) == sum(case.find(tag) is not None for case in cases)
              failures = sum(c['status'] in {'failed', 'error'} for c in output)
              if returncode == 0:
                  assert len(output) == PLANNED and failures == 0
              else:
                  assert failures > 0
              return {'countsKnown': True, 'passedCount': sum(c['status'] == 'passed' for c in output),
                      'failedCount': sum(c['status'] == 'failed' for c in output),
                      'errorCount': sum(c['status'] == 'error' for c in output),
                      'skippedCount': sum(c['status'] == 'skipped' for c in output),
                      'notRunCount': PLANNED - len(output), 'cases': output}


          def verify_sources(root):
              def git(*args):
                  return subprocess.check_output(['git', *args], cwd=root, text=True).strip()
              assert git('rev-parse', 'HEAD') == os.environ['GITHUB_SHA']
              subprocess.run(['git', 'diff', '--quiet', 'HEAD', '--ignore-submodules=untracked'],
                             cwd=root, check=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              for filename, expected in EXPECTED_SOURCES.items():
                  assert hashlib.sha256((root / filename).read_bytes()).hexdigest() == expected
              for name, expected in EXPECTED_MODULES.items():
                  assert git('-C', 'modules/' + name, 'rev-parse', 'HEAD') == expected


          def pg_snapshot():
              import psycopg
              expected = 'postgresql+psycopg://eschf_test:eschf_test@127.0.0.1:15439/eschf_g04_test'
              assert os.environ['ESCHF_TEST_DATABASE_URL'] == os.environ['AIOS_DATABASE_URL'] == expected
              with psycopg.connect(expected.replace('postgresql+psycopg://', 'postgresql://', 1),
                                   connect_timeout=10, options='-c statement_timeout=5000') as connection:
                  connection.execute('SET TRANSACTION READ ONLY')
                  database, actor, version = connection.execute(
                      "SELECT current_database(), current_user, current_setting('server_version_num')::int"
                  ).fetchone()
                  assert database == 'eschf_g04_test' and actor == 'eschf_test'
                  assert type(version) is int and 160000 <= version < 170000
                  schemas = connection.execute(
                      "SELECT count(*) FROM pg_namespace WHERE nspname = 'eschf' "
                      "OR nspname LIKE 'eschf_source_fixture_%'"
                  ).fetchone()[0]
                  locks = connection.execute(
                      "SELECT count(*) FROM pg_locks WHERE locktype = 'advisory' "
                      'AND classid = 0 AND objid = 904121 AND granted'
                  ).fetchone()[0]
                  return version, schemas == 0 and locks == 0


          def main():
              root, temp = Path.cwd(), Path(os.environ['RUNNER_TEMP'])
              summary = {'schemaVersion': 1, 'kind': 'eschf-pg89-persistent-role', 'stage': 'preflight',
                         'passed': False, 'planned': PLANNED, 'countsKnown': False,
                         'passedCount': None, 'failedCount': None, 'errorCount': None,
                         'skippedCount': None, 'notRunCount': None, 'cases': [],
                         'sourceVerifiedAfter': False, 'postflightSchemaClean': False,
                         'cleanupDeferredToHostedJobTeardown': True}
              code = 1
              try:
                  verify_sources(root)
                  for directory in (root, root / 'frontend'):
                      assert not any((directory / name).exists() for name in (
                          '.env', '.env.local', '.env.development', '.env.development.local',
                          '.env.production', '.env.production.local', '.env.test', '.env.test.local'))
                  assert os.environ['AIOS_ENVIRONMENT'] == 'dev'
                  assert os.environ['AIOS_SALES_EMAIL_ENABLED'] == os.environ['AIOS_AI_ENABLED'] == 'false'
                  assert all(os.environ[name] == '' for name in (
                      'AIOS_SMTP_HOST', 'AIOS_SMTP_USER', 'AIOS_SMTP_PASSWORD'))
                  version, clean = pg_snapshot()
                  assert clean
                  summary.update(commit=os.environ['GITHUB_SHA'], sourceSha256=EXPECTED_SOURCES,
                                 moduleSha=EXPECTED_MODULES, postgresVersion=version)
                  summary['stage'] = 'collection'
                  with (temp / 'eschf-collection.log').open('wb') as log:
                      collected = subprocess.run([sys.executable, '-m', 'pytest', '--color=no', '--collect-only', '-q', *SELECTED],
                                                 stdout=log, stderr=subprocess.STDOUT, timeout=90)
                  assert collected.returncode == 0
                  identities = collection((temp / 'eschf-collection.log').read_bytes())
                  summary['collectedIds'] = sorted(EXPECTED_CASES)
                  summary['stage'] = 'execution'
                  junit = temp / 'eschf-pg.junit.xml'
                  with (temp / 'eschf-execution.log').open('wb') as log:
                      completed = subprocess.run([sys.executable, '-m', 'pytest', '--color=no', '-q', '-x', '--tb=short',
                                                  '--junitxml=' + str(junit), *SELECTED],
                                                 stdout=log, stderr=subprocess.STDOUT, timeout=900)
                  numbers = results(junit.read_bytes(), identities, completed.returncode)
                  summary.update(numbers)
                  summary['stage'] = 'completed'
                  summary['passed'] = completed.returncode == 0 and numbers['passedCount'] == PLANNED
                  code = 0 if summary['passed'] else 1
              except Exception:
                  summary['stage'] = 'hold'
                  summary['passed'] = False
              finally:
                  try:
                      verify_sources(root)
                      summary['sourceVerifiedAfter'] = True
                  except Exception:
                      summary['passed'] = False
                  try:
                      version, clean = pg_snapshot()
                      summary['postflightSchemaClean'] = clean
                      summary['postgresVersion'] = version
                      if not clean:
                          summary['passed'] = False
                  except Exception:
                      summary['passed'] = False
                  if not summary['passed']:
                      code = 1
                  (temp / 'erp-ready-eschf-summary.json').write_text(json.dumps(summary, sort_keys=True) + '\n')
                  print('ESCHF stage:', summary['stage'], 'passed:', summary['passedCount'],
                        'failed:', summary['failedCount'], 'not run:', summary['notRunCount'])
              return code


          if __name__ == '__main__':
              sys.exit(main())
      - name: Upload allowlisted numerical ESCHF summary only
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: erp-ready-selective-eschf-summary
          path: ${{ runner.temp }}/erp-ready-eschf-summary.json
          if-no-files-found: error
          retention-days: 7

  finance_migration_pg:
    if: ${{ false }}
    name: Finance organization migration PostgreSQL (1)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      finance-postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aios
          POSTGRES_PASSWORD: aios
          POSTGRES_DB: accounting_test
        ports:
          - "15436:5432"
        options: >-
          --health-cmd "pg_isready -U aios -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      AIOS_ENVIRONMENT: dev
      AIOS_DATABASE_URL: postgresql+psycopg://aios:aios@127.0.0.1:15436/accounting_test
      ACCOUNTING_TEST_POSTGRES_URL: postgresql+psycopg://aios:aios@127.0.0.1:15436/accounting_test
      CRM_JOINT_POSTGRES_ACCEPTANCE: '0'
      AIOS_SALES_EMAIL_ENABLED: 'false'
      AIOS_AI_ENABLED: 'false'
      AIOS_SMTP_HOST: ''
      AIOS_SMTP_USER: ''
      AIOS_SMTP_PASSWORD: ''
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install existing backend dependencies
        run: pip install -r requirements-dev.txt
      - name: Verify isolated Finance migration case
        shell: python
        run: |
          import hashlib
          import json
          import os
          import re
          import subprocess
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          EXPECTED_SOURCES = {'migrations/versions/0196_finance_organization_ownership.py': '043f173d9178e8976122d685abecf1b86513abf7b518fe2872706c5027d840de', 'tests/test_finance_organization_bank_postgres.py': '652edfbe2a1fc301348a6aa8906c681338a4f740846d4dba22076f207e1ff7f9', 'migrations/versions/0075_finance_bank_account.py': '811cfec265127dfd7d360aeaa22fe9458e9fdd2cf191dd3970e588e332dbbcf9', 'tests/conftest.py': 'cde292a2c66763f57af7da643aaf65b246f27c48ebd7b847a8de96fbbec6d714', 'core/db/base.py': 'bd55d885c6900ef4c0f435f306e7ec794d4717d6a02807a11ec923aeed03f04f', 'core/domain/models.py': '4d6c7698688d431f3b0699c9b76acc855c8a08913a0a419534fea0f100213ce3', 'core/runtime/deps.py': 'b73217d72ccb9c3f011c5a331c0279fabf89a278bdc0ed9214d77d476e513636', 'core/services/auth.py': '158f66802ef5af0e6337e97a45eac2de3f722d691df90c2f83b6f0b2fba2c89c', 'core/services/eventbus.py': 'b78f46ba13a8e899796c6c5b978dfe7e14338e7fbcb92853b9be8ba757d9100d', 'core/services/accounting.py': '0bc4ae2f9115bec159309da52ab1bf722ca69b7f6cf4cb362d7861db1ff1f3c6', 'modules/accounting/models.py': '85314d8d866f6df8de90983128bd25c6b72e79e1fa5839ebee7672a3c1ff239e', 'modules/accounting/gateway.py': '04a0cb089cad205458ffc2f7b3d44a93eab9737966a8eb1e22f6b0b5c4b6f448', 'config/settings.py': '5712caeda80cc397bfd995141f29cc5c248835718c0dc0075796fc0c43b167a4', 'modules/finance/models.py': '07df20a79b2b01690e8b0e4b375ac370bbbe53dca3eeab5a977b6ddacb8a9e04', 'modules/finance/routes.py': '27393d24771a078a8dff7cfd282aaf4e5708976f599f4ecf8f0132513645a319', 'modules/finance/schemas.py': '360abc13ff1448075cc924ebcb5534e2922f7a26787646f8ffff0a29c8517e8c', 'modules/finance/allocation.py': 'ed557a55f747c524cd454663d27b5f0f7b51d8776a902f673770d910e692e880'}
          EXPECTED_MODULES = {'finance': 'f98ffe21bf4d239f09ce0472910637ab686284b1', 'hr': 'f8a6e0142f1920b07ec56818f42d156a602ff9c3', 'leads': '9a304f771ba74369ded199168e0e1da3ad6348d2', 'logistics': '6923d2e021980ef2546f382364d38dc34a0fef29', 'marketing': 'd4ed67fdc9b41e7abc370112e1a3fa8a3fe1e282', 'procurement': 'f29ea84bd13342ae572e8c4499031d2f053d3d47', 'production': 'be7d7e198bf09cc41c642d22125db401da5adc48', 'sales': 'b92a576a3d6398068bcaec3d50753cf3aa9bab0f', 'service': '3d33800c44865cd7a7373b29192c5d59d3c4bec8', 'wms': '8b6fb881a03f1a268f07e65f4fa89d195fc933a2'}
          EXPECTED_CASES = {'1973424d802b1c83f1c0dbe2adccd40af9cf4912be2d4cc77eefb9db156e25b0'}
          FILES = ['migrations/versions/0196_finance_organization_ownership.py', 'tests/test_finance_organization_bank_postgres.py', 'migrations/versions/0075_finance_bank_account.py', 'tests/conftest.py', 'core/db/base.py', 'core/domain/models.py', 'core/runtime/deps.py', 'core/services/auth.py', 'core/services/eventbus.py', 'core/services/accounting.py', 'modules/accounting/models.py', 'modules/accounting/gateway.py', 'config/settings.py', 'modules/finance/models.py', 'modules/finance/routes.py', 'modules/finance/schemas.py', 'modules/finance/allocation.py']
          CLASSES = {'tests.test_finance_organization_bank_postgres': 'tests/test_finance_organization_bank_postgres.py'}
          PLANNED = 1
          SELECTED = ('tests/test_finance_organization_bank_postgres.py::test_finance_organization_migration_roundtrip[migration_0196]',)

          EXCEPTION_IDS = {'AssertionError': 1, 'FileNotFoundError': 2, 'ModuleNotFoundError': 3, 'AttributeError': 4, 'TypeError': 5, 'KeyError': 6, 'sqlalchemy.exc.IntegrityError': 7, 'sqlalchemy.exc.ProgrammingError': 8, 'sqlalchemy.exc.OperationalError': 9, 'TimeoutError': 10, 'AccountingError': 11, 'modules.accounting.service.AccountingError': 11}
          DIAGNOSTIC_SOURCES = {'migrations/versions/0196_finance_organization_ownership.py': (1, 97), 'tests/test_finance_organization_bank_postgres.py': (2, 382), 'migrations/versions/0075_finance_bank_account.py': (3, 67), 'tests/conftest.py': (4, 163), 'core/db/base.py': (5, 23), 'core/domain/models.py': (6, 522), 'core/runtime/deps.py': (7, 24), 'core/services/auth.py': (8, 322), 'core/services/eventbus.py': (9, 275), 'core/services/accounting.py': (10, 108), 'modules/accounting/models.py': (11, 1639), 'modules/accounting/gateway.py': (12, 388), 'config/settings.py': (13, 165), 'modules/finance/models.py': (14, 180), 'modules/finance/routes.py': (15, 801), 'modules/finance/schemas.py': (16, 169), 'modules/finance/allocation.py': (17, 78)}
          CHECKOUT_ROOT = str(Path.cwd())


          def collection(data):
              ids = [line for line in data.decode('utf-8').splitlines()
                     if '::' in line]
              assert len(ids) == len(set(ids)) == PLANNED
              assert {hashlib.sha256(value.encode()).hexdigest() for value in ids} == EXPECTED_CASES
              return set(ids)



          def diagnostic(node):
              payload = node.attrib.get('message', '') + '\n' + (node.text or '')
              classes = {code for name, code in EXCEPTION_IDS.items()
                         if re.search(r'^(?:E[ \t]+)?' + re.escape(name) + r'(?::|$)', payload, re.M)}
              frames = []
              suffix = r'(?:in [A-Za-z_][A-Za-z_0-9.<>]*|' + '|'.join(map(re.escape, EXCEPTION_IDS)) + ')'
              for line in payload.splitlines():
                  for filename, (source_id, limit) in DIAGNOSTIC_SOURCES.items():
                      paths = '(?:' + re.escape(filename) + '|' + re.escape(CHECKOUT_ROOT + '/' + filename) + ')'
                      match = re.fullmatch(paths + r':([1-9][0-9]{0,5}): ' + suffix, line.strip())
                      if match and 0 < int(match[1]) <= limit:
                          frame = {'sourceId': source_id, 'line': int(match[1])}
                          if frame not in frames:
                              frames.append(frame)
                              if len(frames) > 3:
                                  frames.pop(0)
              return {'classId': next(iter(classes)) if len(classes) == 1 else 0, 'frames': frames}


          def results(data, collected, returncode):
              assert type(returncode) is int and returncode in (0, 1)
              root = ET.fromstring(data)
              assert root.tag in {'testsuites', 'testsuite'}
              cases = list(root.iter('testcase'))
              assert 0 < len(cases) <= PLANNED
              seen, output = set(), []
              for case in cases:
                  filename = CLASSES[case.attrib['classname']]
                  identity = filename + '::' + case.attrib['name']
                  assert identity in collected and identity not in seen
                  seen.add(identity)
                  statuses = [tag for tag in ('failure', 'error', 'skipped')
                              if case.find(tag) is not None]
                  assert len(statuses) <= 1
                  assert sum(child.tag in {'failure', 'error', 'skipped'} for child in case) == len(statuses)
                  status = {'failure': 'failed', 'error': 'error', 'skipped': 'skipped'}.get(
                      statuses[0] if statuses else '', 'passed')
                  entry = {'id': hashlib.sha256(identity.encode()).hexdigest(), 'status': status}
                  if status in {'failed', 'error'}:
                      entry['diagnostic'] = diagnostic(case.find(statuses[0]))
                  output.append(entry)
              for tag in ('failure', 'error', 'skipped'):
                  assert len(list(root.iter(tag))) == sum(case.find(tag) is not None for case in cases)
              failures = sum(c['status'] in {'failed', 'error'} for c in output)
              if returncode == 0:
                  assert len(output) == PLANNED and failures == 0
              else:
                  assert failures > 0
              return {'countsKnown': True, 'passedCount': sum(c['status'] == 'passed' for c in output),
                      'failedCount': sum(c['status'] == 'failed' for c in output),
                      'errorCount': sum(c['status'] == 'error' for c in output),
                      'skippedCount': sum(c['status'] == 'skipped' for c in output),
                      'notRunCount': PLANNED - len(output), 'cases': output}


          def verify_sources(root):
              def git(*args):
                  return subprocess.check_output(['git', *args], cwd=root, text=True).strip()
              assert git('rev-parse', 'HEAD') == os.environ['GITHUB_SHA']
              subprocess.run(['git', 'diff', '--quiet', 'HEAD', '--ignore-submodules=untracked'],
                             cwd=root, check=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              for filename, expected in EXPECTED_SOURCES.items():
                  assert hashlib.sha256((root / filename).read_bytes()).hexdigest() == expected
              for name, expected in EXPECTED_MODULES.items():
                  assert git('-C', 'modules/' + name, 'rev-parse', 'HEAD') == expected


          def pg_snapshot():
              import psycopg
              expected = 'postgresql+psycopg://aios:aios@127.0.0.1:15436/accounting_test'
              assert os.environ['ACCOUNTING_TEST_POSTGRES_URL'] == os.environ['AIOS_DATABASE_URL'] == expected
              with psycopg.connect(expected.replace('postgresql+psycopg://', 'postgresql://', 1),
                                   connect_timeout=10, options='-c statement_timeout=5000') as connection:
                  connection.execute('SET TRANSACTION READ ONLY')
                  database, actor, version = connection.execute(
                      "SELECT current_database(), current_user, current_setting('server_version_num')::int"
                  ).fetchone()
                  assert database == 'accounting_test' and actor == 'aios'
                  assert type(version) is int and 160000 <= version < 170000
                  databases = connection.execute(
                      "SELECT count(*) FROM pg_database WHERE left(datname, 9) = 'acc_test_'"
                  ).fetchone()[0]
                  connections = connection.execute(
                      "SELECT count(*) FROM pg_stat_activity WHERE left(datname, 9) = 'acc_test_'"
                  ).fetchone()[0]
                  return version, databases == 0 and connections == 0


          def main():
              root, temp = Path.cwd(), Path(os.environ['RUNNER_TEMP'])
              summary = {'schemaVersion': 1, 'kind': 'finance-organization-migration-pg1', 'stage': 'preflight',
                         'passed': False, 'planned': PLANNED, 'countsKnown': False,
                         'passedCount': None, 'failedCount': None, 'errorCount': None,
                         'skippedCount': None, 'notRunCount': None, 'cases': [],
                         'sourceVerifiedAfter': False, 'postflightDatabaseAndConnectionsClean': False,
                         'cleanupDeferredToHostedJobTeardown': True}
              code = 1
              try:
                  verify_sources(root)
                  for directory in (root, root / 'frontend'):
                      assert not any((directory / name).exists() for name in (
                          '.env', '.env.local', '.env.development', '.env.development.local',
                          '.env.production', '.env.production.local', '.env.test', '.env.test.local'))
                  assert os.environ['AIOS_ENVIRONMENT'] == 'dev'
                  assert os.environ['AIOS_SALES_EMAIL_ENABLED'] == os.environ['AIOS_AI_ENABLED'] == 'false'
                  assert all(os.environ[name] == '' for name in (
                      'AIOS_SMTP_HOST', 'AIOS_SMTP_USER', 'AIOS_SMTP_PASSWORD'))
                  version, clean = pg_snapshot()
                  assert clean
                  summary.update(commit=os.environ['GITHUB_SHA'], sourceSha256=EXPECTED_SOURCES,
                                 moduleSha=EXPECTED_MODULES, postgresVersion=version)
                  summary['stage'] = 'collection'
                  with (temp / 'finance0196-collection.log').open('wb') as log:
                      collected = subprocess.run([sys.executable, '-m', 'pytest', '--color=no', '--collect-only', '-q', *SELECTED],
                                                 stdout=log, stderr=subprocess.STDOUT, timeout=90)
                  assert collected.returncode == 0
                  identities = collection((temp / 'finance0196-collection.log').read_bytes())
                  summary['collectedIds'] = sorted(EXPECTED_CASES)
                  summary['stage'] = 'execution'
                  junit = temp / 'finance0196-pg.junit.xml'
                  with (temp / 'finance0196-execution.log').open('wb') as log:
                      completed = subprocess.run([sys.executable, '-m', 'pytest', '--color=no', '-q', '-x', '--tb=short',
                                                  '--junitxml=' + str(junit), *SELECTED],
                                                 stdout=log, stderr=subprocess.STDOUT, timeout=900)
                  numbers = results(junit.read_bytes(), identities, completed.returncode)
                  summary.update(numbers)
                  summary['stage'] = 'completed'
                  summary['passed'] = completed.returncode == 0 and numbers['passedCount'] == PLANNED
                  code = 0 if summary['passed'] else 1
              except Exception:
                  summary['stage'] = 'hold'
                  summary['passed'] = False
              finally:
                  try:
                      verify_sources(root)
                      summary['sourceVerifiedAfter'] = True
                  except Exception:
                      summary['passed'] = False
                  try:
                      version, clean = pg_snapshot()
                      summary['postflightDatabaseAndConnectionsClean'] = clean
                      summary['postgresVersion'] = version
                      if not clean:
                          summary['passed'] = False
                  except Exception:
                      summary['passed'] = False
                  if not summary['passed']:
                      code = 1
                  (temp / 'erp-ready-finance-summary.json').write_text(json.dumps(summary, sort_keys=True) + '\n')
                  print('Accounting stage:', summary['stage'], 'passed:', summary['passedCount'],
                        'failed:', summary['failedCount'], 'not run:', summary['notRunCount'])
              return code


          if __name__ == '__main__':
              sys.exit(main())
      - name: Upload allowlisted numerical Finance summary only
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: erp-ready-finance-numeric
          path: ${{ runner.temp }}/erp-ready-finance-summary.json
          if-no-files-found: error
          retention-days: 1
