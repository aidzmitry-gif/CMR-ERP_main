name: ERP-READY selective E2E QA

on:
  push:
    branches:
      - "agent/erp-ready-001-e2e-20261017"

permissions:
  contents: read

jobs:
  e2e:
    if: ${{ false }}
    name: Catalogue rendered UI (3 + setup)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      E2E_BACKEND_PORT: "18471"
      E2E_FRONTEND_PORT: "18472"
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: pip install -r requirements-dev.txt
      - name: Native PDF dependencies
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu-core
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Chromium
        working-directory: frontend
        run: npx --no-install playwright install --with-deps chromium
      - name: Verify rendered catalogue scenarios
        run: python scripts/check_reference_catalog_ui.py
      - name: Numerical result only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: erp-ready-catalogue-summary
          path: ${{ runner.temp }}/erp-ready-catalogue-summary.json
          if-no-files-found: error
          retention-days: 7

  eschf_pg:
    if: ${{ false }}
    name: ESCHF source and freshness persisted-role regression (89)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      eschf-postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: eschf_test
          POSTGRES_PASSWORD: eschf_test
          POSTGRES_DB: eschf_g04_test
        ports:
          - "15439:5432"
        options: >-
          --health-cmd "pg_isready -U eschf_test -d eschf_g04_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      AIOS_ENVIRONMENT: dev
      AIOS_DATABASE_URL: postgresql+psycopg://eschf_test:eschf_test@127.0.0.1:15439/eschf_g04_test
      ESCHF_TEST_DATABASE_URL: postgresql+psycopg://eschf_test:eschf_test@127.0.0.1:15439/eschf_g04_test
      AIOS_SALES_EMAIL_ENABLED: 'false'
      AIOS_AI_ENABLED: 'false'
      AIOS_SMTP_HOST: ''
      AIOS_SMTP_USER: ''
      AIOS_SMTP_PASSWORD: ''
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install existing backend dependencies
        run: pip install -r requirements-dev.txt
      - name: Verify isolated ESCHF source and freshness cases
        shell: python
        run: |
          import hashlib
          import json
          import os
          import re
          import subprocess
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          EXPECTED_SOURCES = {'tests/eschf/test_source_postgres.py': 'eefd00e738d6510904edea69dbef48b9692b74cbf7d2cd81d82427fa69ee136a', 'tests/eschf/test_freshness_postgres.py': '161aa2b4dc89a231748329f6b3dc8d3be8536092136ff96dfbf4f2e6a0be54f8', 'tests/eschf/test_repository_postgres.py': '74fb84bef7e87e66471d15192e7468e19fd884d500d4c9fb926aff254ee4caad', 'migrations/versions/0121_eschf_durable_state.py': '0f0700b64de476426361041d005ce25a76b392a4ddb72af2f4a52d3c5eb7fee2'}
