name: ERP-READY catalogue QA

on:
  push:
    branches:
      - "agent/erp-ready-001-catalogue-qa-20261018"

permissions:
  contents: read

jobs:
  e2e:
    name: Catalogue rendered UI (3 + setup)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      E2E_BACKEND_PORT: "18471"
      E2E_FRONTEND_PORT: "18472"
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: pip install -r requirements-dev.txt
      - name: Native PDF dependencies
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu-core
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Chromium
        working-directory: frontend
        run: npx --no-install playwright install --with-deps chromium
      - name: Verify rendered catalogue scenarios
        run: python scripts/check_reference_catalog_ui.py
      - name: Numerical result only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: erp-ready-catalogue-summary
          path: ${{ runner.temp }}/erp-ready-catalogue-summary.json
          if-no-files-found: error
          retention-days: 7
