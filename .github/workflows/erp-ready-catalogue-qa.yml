name: ERP-READY pool lifecycle diagnosis

on:
  push:
    branches:
      - "agent/erp-ready-001-catalogue-qa-20261018"

permissions:
  contents: read

jobs:
  e2e:
    name: Pool lifecycle (3 isolated synthetic scenarios)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: erp-ready-001-ci-lint
    env:
      CI: "true"
      ERP_POOL_DRIVER_ROOT: ${{ github.workspace }}/driver
      ERP_POOL_SOURCE_ROOT: ${{ github.workspace }}/erp-ready-001-ci-lint
      ERP_POOL_EXPECTED_BUNDLE_SHA256: "5cfffcb88d2ef1eed454cf6836a2a4c624efa287645db23a9c523e54bf91319b"
    steps:
      - name: Checkout diagnostic driver
        uses: actions/checkout@v5
        with:
          path: driver
          persist-credentials: false
      - name: Checkout frozen application
        uses: actions/checkout@v5
        with:
          ref: "6e8f316862b968dd0efcd05b4e77f2e4415294e4"
          path: erp-ready-001-ci-lint
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: pip install -r requirements-dev.txt
      - name: Native PDF dependencies
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu-core
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Install frozen frontend dependencies
        working-directory: erp-ready-001-ci-lint/frontend
        run: npm ci
      - name: Install Chromium
        working-directory: erp-ready-001-ci-lint/frontend
        run: npx --no-install playwright install --with-deps chromium
      - name: Diagnose real HTTP and Next connection lifetimes
        run: |
          python - <<'PYCODE'
          import os
          import shutil
          from pathlib import Path
          source = Path(os.environ["ERP_POOL_DRIVER_ROOT"]) / "ops/erp-ready-pool"
          target = Path(os.environ["RUNNER_TEMP"]) / "erp-ready-pool"
          shutil.copytree(source, target)
          PYCODE
          python "$RUNNER_TEMP/erp-ready-pool/G12LH-run-pool.py"
      - name: Numerical result only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: erp-ready-pool-summary
          path: ${{ runner.temp }}/erp-ready-pool-summary.json
          if-no-files-found: error
          retention-days: 7
