name: CI

on:
  push:
  pull_request:

# Push and pull_request can target the same commit. Keep one run for that SHA;
# do not cancel a different commit whose backend run still provides useful evidence.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (unit + api + integration)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aios
          POSTGRES_PASSWORD: aios
          POSTGRES_DB: aios
        ports:
          - "5432:5432"
          - "15436:5432"
        options: >-
          --health-cmd "pg_isready -U aios -d aios"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      crm-postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: joint_test
          POSTGRES_PASSWORD: joint_test_local_only
          POSTGRES_DB: joint_acceptance
        ports:
          - "15442:5432"
        options: >-
          --health-cmd "pg_isready -U joint_test -d joint_acceptance"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      eschf-postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: eschf_test
          POSTGRES_PASSWORD: eschf_test
          POSTGRES_DB: eschf_g04_test
        ports:
          - "15439:5432"
        options: >-
          --health-cmd "pg_isready -U eschf_test -d eschf_g04_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # реальный Postgres для integration-слоя (тесты сами берут этот URL)
      AIOS_DATABASE_URL: postgresql+psycopg://aios:aios@localhost:5432/aios
      # CI — не прод: разрешаем dev-дефолтные креды (Settings P0-5 иначе отклоняет aios:aios)
      AIOS_ENVIRONMENT: dev
      # Dedicated admin DB; accounting fixtures create/drop their own UUID databases.
      ACCOUNTING_TEST_POSTGRES_URL: postgresql+psycopg://aios:aios@127.0.0.1:15436/accounting_test
      # CRM lock fixtures use unique disposable schemas in this isolated service.
      CRM_JOINT_POSTGRES_ACCEPTANCE: "1"
      CRM_READY_OWNERS_DATABASE_URL: postgresql+psycopg://joint_test:joint_test_local_only@127.0.0.1:15442/joint_acceptance
      CRM_READY_CALLS_DATABASE_URL: postgresql+psycopg://joint_test:joint_test_local_only@127.0.0.1:15442/joint_acceptance
      CRM_READY_G02_DATABASE_URL: postgresql+psycopg://joint_test:joint_test_local_only@127.0.0.1:15442/joint_acceptance
      # Isolated service: ESCHF fixtures reset only this explicitly guarded test DB.
      ESCHF_TEST_DATABASE_URL: postgresql+psycopg://eschf_test:eschf_test@127.0.0.1:15439/eschf_g04_test

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r requirements-dev.txt
      - name: Native dependencies for immutable document PDFs
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu-core
      - name: Invitation release gate (offline, secret-safe)
        run: python scripts/invitation_release_gate.py
      - name: Lint (ruff)
        run: ruff check .
      - name: Apply migrations (Postgres)
        run: alembic upgrade head
      - name: Apply migrations to isolated CRM acceptance database
        env:
          AIOS_DATABASE_URL: postgresql+psycopg://joint_test:joint_test_local_only@127.0.0.1:15442/joint_acceptance
        run: alembic upgrade head
      - name: Create isolated accounting acceptance database
        run: |
          python - <<'PY'
          import psycopg
          with psycopg.connect("postgresql://aios:aios@localhost:5432/aios", autocommit=True) as connection:
              connection.execute("CREATE DATABASE accounting_test")
          PY
      - name: Tests with coverage (unit + api + integration)
        env:
          PRODUCER_PG_EVIDENCE_DIR: ${{ runner.temp }}/producer-pg-evidence
        run: >-
          pytest -q
          --cov --cov-branch
          --cov-report=xml --cov-report=term-missing
          --cov-fail-under=90
      - name: Coverage summary
        if: always()
        run: |
          echo "### Backend coverage" >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          try:
              root = ET.parse("coverage.xml").getroot()
              print(f"Line rate: **{float(root.get('line-rate'))*100:.1f}%**, "
                    f"branch rate: **{float(root.get('branch-rate'))*100:.1f}%**")
          except Exception as exc:  # pragma: no cover
              print(f"coverage.xml не прочитан: {exc}")
          PY
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage-backend
          path: coverage.xml

      - name: Upload PostgreSQL acceptance evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: producer-postgres-evidence
          path: ${{ runner.temp }}/producer-pg-evidence/
          if-no-files-found: warn

  frontend:
    name: Frontend (unit + component, Vitest + RTL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Install deps
        run: npm install
      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck
      - name: Lint (eslint, храповик — потолок не поднимать, только опускать)
        run: npm run lint -- --max-warnings 47
      - name: Tests with coverage (Vitest + RTL)
        run: npm run test:coverage
      - name: Coverage summary
        if: always()
        run: |
          echo "### Frontend coverage" >> "$GITHUB_STEP_SUMMARY"
          { node -e "const s=require('./coverage/coverage-summary.json').total;console.log('Lines: **'+s.lines.pct+'%**, statements: **'+s.statements.pct+'%**, branches: **'+s.branches.pct+'%**')"; } >> "$GITHUB_STEP_SUMMARY" || echo "coverage-summary.json не найден" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage-frontend
          path: frontend/coverage/

  e2e:
    name: E2E (Playwright, критический путь)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install backend deps
        run: pip install -r requirements-dev.txt
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Install frontend deps
        working-directory: frontend
        run: npm install
      - name: Install Playwright (chromium)
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run E2E (поднимает FastAPI + Next через webServer)
        working-directory: frontend
        run: npm run e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: frontend/playwright-report/
