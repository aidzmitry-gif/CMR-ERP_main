name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (unit + api + integration)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aios
          POSTGRES_PASSWORD: aios
          POSTGRES_DB: aios
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U aios -d aios"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # реальный Postgres для integration-слоя (тесты сами берут этот URL)
      AIOS_DATABASE_URL: postgresql+psycopg://aios:aios@localhost:5432/aios

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Apply migrations (Postgres)
        run: alembic upgrade head
      - name: Tests with coverage (unit + api + integration)
        run: >-
          pytest -q
          --cov --cov-branch
          --cov-report=xml --cov-report=term-missing
          --cov-fail-under=90
      - name: Coverage summary
        if: always()
        run: |
          echo "### Backend coverage" >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          try:
              root = ET.parse("coverage.xml").getroot()
              print(f"Line rate: **{float(root.get('line-rate'))*100:.1f}%**, "
                    f"branch rate: **{float(root.get('branch-rate'))*100:.1f}%**")
          except Exception as exc:  # pragma: no cover
              print(f"coverage.xml не прочитан: {exc}")
          PY
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-backend
          path: coverage.xml

  frontend:
    name: Frontend (unit + component, Vitest + RTL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install deps
        run: npm install
      - name: Tests with coverage (Vitest + RTL)
        run: npm run test:coverage
      - name: Coverage summary
        if: always()
        run: |
          echo "### Frontend coverage" >> "$GITHUB_STEP_SUMMARY"
          { node -e "const s=require('./coverage/coverage-summary.json').total;console.log('Lines: **'+s.lines.pct+'%**, statements: **'+s.statements.pct+'%**, branches: **'+s.branches.pct+'%**')"; } >> "$GITHUB_STEP_SUMMARY" || echo "coverage-summary.json не найден" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend
          path: frontend/coverage/

  e2e:
    name: E2E (Playwright, критический путь)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend deps
        run: pip install -r requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install frontend deps
        working-directory: frontend
        run: npm install
      - name: Install Playwright (chromium)
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run E2E (поднимает FastAPI + Next через webServer)
        working-directory: frontend
        run: npm run e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
