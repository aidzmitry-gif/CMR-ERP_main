name: Security

on:
  pull_request:
  push:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pinned production dependencies
        run: pip install --require-hashes -r requirements.lock.txt
      - name: Audit production Python dependencies against OSV
        run: |
          pip install pip-audit==2.10.0
          pip-audit --vulnerability-service osv --disable-pip --no-deps -r requirements.lock.txt
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Audit locked frontend production dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=moderate
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Scan git history for secrets (redacted)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_SUMMARY: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Build the production image
        run: docker build -t aios-security-ci .
      - name: Verify non-root identity, writable data and native PDF support
        run: |
          docker run --rm --network none --entrypoint python aios-security-ci -c '
          import os, pathlib
          from weasyprint import HTML
          assert os.getuid() == 10001 and os.getgid() == 10001
          p = pathlib.Path("/app/data/security-smoke.tmp")
          p.write_text("synthetic smoke")
          p.unlink()
          assert HTML(string="<p>Security smoke</p>").write_pdf().startswith(b"%PDF-")
          '
