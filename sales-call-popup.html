<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Окно входящего звонка — screen-pop (CRM)</title>
<style>
  :root{
    --brand:#2563EB; --brand-50:#EFF5FF; --brand-100:#EAF1FF; --brand-700:#1D4FD7;
    --canvas:#F4F5F7; --ink:#1F2937; --muted:#6B7280;
    --shadow-pop:0 24px 64px rgba(15,23,42,.30);
    --ok:#22C55E; --warn:#F59E0B; --bad:#EF4444; --ai:#7C3AED; --ai-50:#F5F3FF;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:var(--ink);font-size:14px;min-height:100vh}

  /* фон — будто CRM под окном */
  .backdrop{position:fixed;inset:0;background:
     radial-gradient(1200px 600px at 80% -10%, #E3ECFF, transparent),
     linear-gradient(180deg,#EEF1F6,#F4F5F7);z-index:0}
  .bd-bars{position:fixed;inset:0;z-index:0;opacity:.5;filter:blur(2px);padding:70px 40px;display:grid;grid-template-columns:repeat(4,1fr);gap:16px;align-content:start}
  .bd-bars .b{height:120px;background:#fff;border-radius:14px;box-shadow:0 1px 3px rgba(16,24,40,.06)}
  .scrim{position:fixed;inset:0;background:rgba(15,23,42,.34);z-index:1}

  /* переключатель состояний (для демо) */
  .states{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:10;background:#fff;border:1px solid #E5E7EB;border-radius:12px;box-shadow:0 8px 24px rgba(16,24,40,.12);padding:6px;display:flex;gap:5px;flex-wrap:wrap;max-width:94vw}
  .states button{font-size:12px;font-weight:600;border:1px solid transparent;background:#F4F5F7;color:#475467;border-radius:8px;padding:7px 11px;cursor:pointer}
  .states button.on{background:var(--brand);color:#fff}
  .hint{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:10;font-size:11.5px;color:#fff;background:rgba(15,23,42,.6);border-radius:9px;padding:7px 13px;max-width:92vw;text-align:center}

  /* окно звонка */
  .wrap{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;padding:80px 16px 40px}
  .pop{width:430px;max-width:96vw;background:#fff;border-radius:18px;box-shadow:var(--shadow-pop);overflow:hidden;animation:pin .25s cubic-bezier(.4,0,.2,1)}
  @keyframes pin{from{transform:translateY(14px) scale(.98);opacity:0}to{transform:none;opacity:1}}

  /* шапка звонка */
  .cp-head{padding:18px 20px;display:flex;align-items:center;gap:13px;color:#fff;position:relative}
  .cp-head.in{background:linear-gradient(135deg,#16A34A,#15803D)}
  .cp-head.live{background:linear-gradient(135deg,#2563EB,#1D4FD7)}
  .cp-head.done{background:linear-gradient(135deg,#475569,#334155)}
  .cp-head.unknown{background:linear-gradient(135deg,#D97706,#B45309)}
  .ring{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
  .cp-head.in .ring{animation:ring 1.1s infinite}
  @keyframes ring{0%{box-shadow:0 0 0 0 rgba(255,255,255,.5)}70%{box-shadow:0 0 0 14px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
  .cp-h-t{flex:1;min-width:0}
  .cp-ttl{font-size:15px;font-weight:800}
  .cp-line{font-size:12px;opacity:.85;margin-top:1px}
  .cp-num{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
  .cp-timer{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}

  .cp-body{padding:16px 20px}

  /* клиент */
  .cp-client{display:flex;align-items:center;gap:12px}
  .ava{width:46px;height:46px;border-radius:12px;background:var(--brand-50);color:var(--brand-700);font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .ava.q{background:#FEF3C7;color:#B45309}
  .ci{min-width:0}
  .cn{font-size:16px;font-weight:800;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .reg{font-size:10.5px;font-weight:700;color:#047857;background:#ECFDF5;border-radius:5px;padding:1px 7px}
  .cr{font-size:12.5px;color:var(--muted);margin-top:2px}

  .cp-owner{margin-top:12px;font-size:12.5px;color:#334155;background:#F8FAFC;border-radius:9px;padding:8px 11px}
  .cp-owner.foreign{background:#FFFBEB;color:#92400E}
  .cp-owner a{color:var(--brand-700);font-weight:600;cursor:pointer;text-decoration:none}

  /* сделка */
  .cp-deal{margin-top:12px;border:1px solid #EEF0F2;border-radius:11px;padding:11px 13px}
  .dh{font-size:10.5px;font-weight:700;text-transform:uppercase;color:#9aa3b0;letter-spacing:.03em}
  .drow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:5px;font-size:13.5px;font-weight:700}
  .drow .stg{font-size:10.5px;font-weight:700;background:var(--brand-50);color:var(--brand-700);border-radius:5px;padding:1px 7px}
  .drow .ship{font-size:10.5px;font-weight:700;background:#FFF7ED;color:#C2410C;border-radius:5px;padding:1px 7px}
  .dnext{font-size:12px;color:var(--muted);margin-top:5px}

  /* AI-подсказка */
  .cp-ai{margin-top:12px;background:var(--ai-50);border:1px solid #EDE9FE;border-radius:11px;padding:11px 13px;font-size:12.5px;color:#3b2d63;line-height:1.5}
  .cp-ai b{color:#5B21B6}
  .cp-ai .tps{margin-top:7px;display:flex;flex-direction:column;gap:4px}
  .cp-ai .tp{display:flex;gap:7px;align-items:flex-start}.cp-ai .tp .i{flex-shrink:0}

  /* действия */
  .cp-actions{display:flex;gap:10px;margin-top:16px}
  .cp-actions button{flex:1;border:none;border-radius:12px;padding:13px;font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px}
  .accept{background:var(--ok);color:#fff}
  .decline{background:#fff;color:#B91C1C;border:1px solid #FECACA!important}
  .endcall{background:var(--bad);color:#fff}
  .cp-actions button:hover{filter:brightness(.97)}
  .cp-sub{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap}
  .cp-sub span{flex:1;text-align:center;border:1px solid #E5E7EB;border-radius:9px;padding:8px;font-size:12px;font-weight:600;color:#475467;cursor:pointer;min-width:120px}
  .cp-sub span:hover{background:#F8FAFC}

  /* in-call: пульт */
  .dialpad{display:flex;gap:8px;margin-top:14px}
  .dialpad .k{flex:1;border:1px solid #E5E7EB;border-radius:10px;padding:9px;text-align:center;font-size:12px;font-weight:600;color:#475467;cursor:pointer;background:#fff}
  .dialpad .k:hover{background:#F8FAFC}
  .script{margin-top:13px;border:1px solid #EEF0F2;border-radius:11px;padding:11px 13px}
  .script .sh{font-size:10.5px;font-weight:700;text-transform:uppercase;color:#9aa3b0;margin-bottom:7px}
  .ck{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;padding:4px 0;cursor:pointer}
  .ck .box{width:16px;height:16px;border:2px solid #CBD5E1;border-radius:5px;flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff}
  .ck.on .box{background:var(--ok);border-color:var(--ok)}
  .ck.on .t{text-decoration:line-through;color:#9aa3b0}
  .livenote{width:100%;border:1px solid #E5E7EB;border-radius:10px;padding:9px 11px;font-size:12.5px;font-family:inherit;margin-top:12px;resize:vertical;min-height:54px}
  .livenote:focus{outline:none;border-color:var(--brand)}
  .reserve{margin-top:12px;background:#FFFBEB;border:1px solid #FDE68A;border-radius:11px;padding:11px 13px;font-size:12.5px;color:#92400E;line-height:1.5}
  .reserve b{color:#78350F}

  /* after-call: итог */
  .seg{display:flex;gap:7px;flex-wrap:wrap;margin-top:7px}
  .seg button{border:1px solid #E5E7EB;background:#fff;border-radius:9px;padding:8px 12px;font-size:12.5px;font-weight:600;color:#475467;cursor:pointer}
  .seg button.on{background:var(--brand-50);border-color:var(--brand);color:var(--brand-700)}
  .fld{margin-top:13px}
  .fld .l{font-size:11px;font-weight:700;text-transform:uppercase;color:#9aa3b0;margin-bottom:5px}
  .fld select,.fld input{width:100%;border:1px solid #E5E7EB;border-radius:10px;padding:9px 11px;font-size:13px;font-family:inherit}
  .rec{margin-top:13px;display:flex;align-items:center;gap:10px;background:#F8FAFC;border-radius:10px;padding:9px 12px;font-size:12px;color:#475467}
  .rec .play{width:30px;height:30px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
  .rec .pend{margin-left:auto;color:#9aa3b0}

  /* новый лид */
  .newlead{margin-top:12px}
  .newlead input{width:100%;border:1px solid #E5E7EB;border-radius:10px;padding:9px 11px;font-size:13px;font-family:inherit;margin-bottom:8px}
  .newlead .grow{display:flex;gap:8px}.newlead .grow input{margin-bottom:0}

  .src{font-size:10.5px;color:#9aa3b0;text-align:center;padding:10px 16px 14px}

  /* телефон в одну строку */
  .cp-num{white-space:nowrap;font-size:14px;line-height:1.2}

  /* новый клиент: УНП → реквизиты */
  .unp-row{display:flex;gap:8px;margin-top:12px}
  .unp-row input{flex:1;min-width:0;border:1px solid #E5E7EB;border-radius:10px;padding:9px 11px;font-size:13px;font-family:inherit}
  .unp-row button{border:none;background:var(--brand);color:#fff;border-radius:10px;padding:0 13px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap}
  .req{margin-top:12px;border:1px solid #BBF7D0;background:#F0FDF4;border-radius:11px;padding:11px 13px}
  .req .rh{font-size:11px;font-weight:800;text-transform:uppercase;color:#047857;margin-bottom:6px}
  .req .kv2{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:3px 0}
  .req .kv2 .k{color:#5b8c74}
  .terms-lbl{font-size:11px;font-weight:700;text-transform:uppercase;color:#9aa3b0;margin:13px 0 5px}

  /* широкое окно разговора с большим чек-листом */
  .pop.wide{width:840px;max-width:96vw}
  .live-grid{display:grid;grid-template-columns:1fr 1.08fr}
  .lg-left{padding:16px 18px;border-right:1px solid #F1F3F5}
  .lg-right{padding:16px 18px;background:#FBFCFE;max-height:62vh;overflow:auto}
  @media(max-width:780px){.pop.wide{width:96vw}.live-grid{grid-template-columns:1fr}.lg-left{border-right:none;border-bottom:1px solid #F1F3F5}}
  .lg-ctx{display:flex;align-items:center;gap:10px;background:#EFF5FF;border-radius:10px;padding:9px 11px;margin-bottom:12px}
  .lg-ctx .a{width:34px;height:34px;border-radius:9px;background:#fff;color:var(--brand-700);font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center}
  .lg-ctx .t{font-size:13px;font-weight:700}.lg-ctx .s{font-size:11.5px;color:#475467}
  .script-full .scc{margin-bottom:13px}
  .script-full .scc-h{font-size:11px;font-weight:800;text-transform:uppercase;color:var(--brand-700);letter-spacing:.02em;margin-bottom:5px;display:flex;align-items:center;gap:7px}
  .script-full .scc-h .n{background:var(--brand);color:#fff;border-radius:50%;width:17px;height:17px;display:flex;align-items:center;justify-content:center;font-size:10px}

  /* инлайн-оформление нового клиента в разговоре */
  .order-flow .ofstep{margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid #EEF0F2}
  .order-flow .ofstep:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
  .ofs-h{font-size:11px;font-weight:800;text-transform:uppercase;color:var(--brand-700);margin-bottom:8px;display:flex;align-items:center;gap:7px}
  .ofs-h .n{background:var(--brand);color:#fff;border-radius:50%;width:17px;height:17px;display:flex;align-items:center;justify-content:center;font-size:10px}
  .ministock .ms-row{display:grid;grid-template-columns:20px 1fr 64px 50px;gap:8px;align-items:center;font-size:12.5px;padding:6px 0;border-top:1px solid #F6F7F9}
  .ministock .ms-row:first-child{border-top:none}
  .ministock input[type=checkbox]{width:16px;height:16px;accent-color:var(--brand)}
  .ministock .nm{font-weight:600;min-width:0}.ministock .nm small{display:block;color:#9aa3b0;font-size:10.5px}
  .ministock .pr{text-align:right;font-weight:600}
  .ministock .q{width:46px;border:1px solid #E5E7EB;border-radius:6px;padding:4px;font-size:12px;text-align:center;font-family:inherit}
  .resv-toggle{display:flex;gap:9px;align-items:center;font-size:12.5px;background:#FFFBEB;border:1px solid #FDE68A;border-radius:10px;padding:10px 12px;cursor:pointer;color:#92400E;font-weight:600}
  .resv-toggle input{width:17px;height:17px;accent-color:var(--warn)}
  .hintline{font-size:11px;color:#9aa3b0;margin-top:8px;text-align:center}

  /* вкладки в окне разговора: скрипт / заказ */
  .lg-tabs{display:flex;gap:6px;margin-bottom:12px}
  .lg-tabs button{flex:1;border:1px solid #E5E7EB;background:#fff;border-radius:8px;padding:7px;font-size:12px;font-weight:600;color:#475467;cursor:pointer}
  .lg-tabs button.on{background:var(--brand);border-color:var(--brand);color:#fff}
  .repeat{background:#ECFDF5;border:1px solid #A7F3D0;border-radius:10px;padding:11px 13px;margin-bottom:13px}
  .repeat .rt{font-size:12.5px;color:#065F46;line-height:1.5}.repeat .rt b{color:#047857}
  .repeat .btn-rep{margin-top:9px;border:none;background:#047857;color:#fff;border-radius:8px;padding:8px 12px;font-size:12px;font-weight:700;cursor:pointer}

  /* окно разговора в 3 колонки */
  .pop.wide3{width:1180px;max-width:97vw}
  .live3{display:grid;grid-template-columns:1fr 1.12fr 0.92fr}
  .l3col{padding:15px 16px;border-right:1px solid #F1F3F5;max-height:66vh;overflow:auto}
  .l3col:last-child{border-right:none}
  .l3h{font-size:11px;font-weight:800;text-transform:uppercase;color:#9aa3b0;margin-bottom:11px}
  @media(max-width:1000px){.pop.wide3{width:96vw}.live3{grid-template-columns:1fr}.l3col{border-right:none;border-bottom:1px solid #F1F3F5;max-height:none}}
  .add-more{width:100%;border:1px dashed #C7D2FE;background:var(--brand-50);color:var(--brand-700);border-radius:9px;padding:9px;font-size:12px;font-weight:600;cursor:pointer;margin-top:9px}
  .add-more:hover{background:var(--brand-100)}
  .order-cta{display:flex;flex-direction:column;gap:8px;margin-top:13px}
  .order-cta button{width:100%;border-radius:11px;padding:11px;font-size:13px;font-weight:700;cursor:pointer}
  .order-cta .inv{border:none;background:var(--ok);color:#fff}
  .order-cta .ctr{border:1px solid #E5E7EB;background:#fff;color:#475467}
  .order-cta button:hover{filter:brightness(.97)}

  /* модалка предпросмотра документа (счёт/договор) + подбора */
  .ov2{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:120;display:none;align-items:center;justify-content:center;padding:24px}
  .ov2.show{display:flex}
  .docview{background:#fff;border-radius:14px;width:560px;max-width:96vw;max-height:90vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 64px rgba(15,23,42,.35)}
  .dv-h{padding:13px 18px;border-bottom:1px solid #F1F3F5;font-weight:800;font-size:14px;display:flex;align-items:center;gap:8px}
  .dv-h .x{margin-left:auto;color:#9aa3b0;cursor:pointer}
  .dv-b{overflow:auto;background:#F4F5F7;flex:1}
  .dv-f{padding:12px 18px;border-top:1px solid #F1F3F5;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .dv-note{font-size:11.5px;color:#B45309;margin-right:auto;font-weight:600}
  .btn-sec{border:1px solid #E5E7EB;background:#fff;color:#475467;border-radius:9px;padding:9px 13px;font-size:12.5px;font-weight:600;cursor:pointer}
  .btn-send{border:none;background:var(--ok);color:#fff;border-radius:9px;padding:9px 14px;font-size:12.5px;font-weight:700;cursor:pointer}

  /* «бумага» документа */
  .paper{background:#fff;margin:16px;border-radius:8px;box-shadow:0 1px 4px rgba(16,24,40,.1);padding:22px 24px;font-size:12.5px;color:#1F2937;line-height:1.5}
  .pp-h{display:flex;justify-content:space-between;gap:12px;border-bottom:2px solid #1F2937;padding-bottom:10px;margin-bottom:12px}
  .pp-org{font-size:15px;font-weight:800}.pp-sub{font-size:11px;color:#6B7280}
  .pp-no{text-align:right;font-weight:700;white-space:nowrap}
  .pp-parties{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;font-size:12px}
  .pp-t{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:10px}
  .pp-t th,.pp-t td{border:1px solid #E5E7EB;padding:6px 8px;text-align:left}
  .pp-t th{background:#F8FAFC;font-size:10.5px;text-transform:uppercase;color:#6B7280}
  .pp-t td.r,.pp-t th.r{text-align:right}
  .pp-tot{text-align:right;font-weight:800;font-size:13px;margin-bottom:8px}
  .pp-foot{font-size:11px;color:#6B7280;border-top:1px solid #EEF0F2;padding-top:8px}
  .pp-title{font-size:15px;font-weight:800;text-align:center}
  .pp-date{text-align:center;color:#6B7280;font-size:11px;margin-bottom:12px}
  .paper p{margin-bottom:8px}
  .pp-sign{display:flex;justify-content:space-between;margin-top:22px;font-size:11px;color:#475467}

  /* таблица подбора со склада (мультисклад) */
  .st-toolbar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
  .st-toolbar input,.st-toolbar select{border:1px solid #E5E7EB;border-radius:9px;padding:8px 11px;font-size:12.5px;font-family:inherit}
  .st-toolbar .grow{flex:1;min-width:140px}
  .stbl{width:100%;border-collapse:collapse;font-size:12.5px}
  .stbl th{font-size:10px;text-transform:uppercase;letter-spacing:.02em;color:#6B7280;background:#F8FAFC;padding:8px;text-align:left;position:sticky;top:0;border-bottom:1px solid #E5E7EB;z-index:1}
  .stbl th.r,.stbl td.r{text-align:right}
  .stbl td{padding:7px 8px;border-bottom:1px solid #F1F3F5;vertical-align:middle}
  .stbl tr.grp-first td{border-top:2px solid #EAECEF}
  .stbl .pname{font-weight:700}
  .stbl .pname small{display:block;color:#9aa3b0;font-weight:500;font-size:10.5px;margin-top:1px}
  .stbl .wh{color:#475467;white-space:nowrap}
  .stbl .res{color:#B45309;font-weight:600}
  .stbl .free{color:#047857;font-weight:800}
  .stbl .free.low{color:#B91C1C}
  .stbl .price{font-weight:700;white-space:nowrap}
  .stbl .q{width:68px;border:1px solid #E5E7EB;border-radius:6px;padding:5px;font-size:12px;text-align:center;font-family:inherit}
  .stbl input[type=checkbox]{width:16px;height:16px;accent-color:var(--brand)}
  .st-legend{display:flex;gap:14px;font-size:11px;color:#6B7280;margin-top:11px;flex-wrap:wrap}
</style>
</head>
<body>
  <a href="sales-2.0-index.html" style="position:fixed;left:14px;bottom:14px;z-index:9999;display:inline-flex;align-items:center;gap:6px;font:600 12.5px -apple-system,'Segoe UI',sans-serif;color:#1D4FD7;text-decoration:none;background:#fff;border:1px solid #E5E7EB;border-radius:9px;padding:8px 12px;box-shadow:0 4px 14px rgba(16,24,40,.12)">← К списку макетов</a>
  <div class="backdrop"></div>
  <div class="bd-bars"><div class="b"></div><div class="b"></div><div class="b"></div><div class="b"></div><div class="b"></div><div class="b"></div><div class="b"></div><div class="b"></div></div>
  <div class="scrim"></div>

  <div class="states">
    <button class="on" onclick="show('known',this)">Узнан · есть сделка</button>
    <button onclick="show('nodeals',this)">Узнан · без сделки</button>
    <button onclick="show('unknown',this)">Новый номер</button>
    <button onclick="show('live',this)">Идёт разговор</button>
    <button onclick="show('livenew',this)">Разговор · новый клиент</button>
    <button onclick="show('done',this)">Итог звонка</button>
  </div>

const STOCK_WH = [

    {name:"Минск (центр.)", on:54, res:13},
    {name:"Гомель", on:20, res:0},

  ]},

  ]},
  {sku:"Зарядное устройство ЗУ-15А", pr:"420 Br", wh:[
    {name:"Минск (центр.)", on:30, res:0},
    {name:"Гомель", on:12, res:2}
  ]},
  {sku:"Тестер АКБ цифровой", pr:"180 Br", wh:[
    {name:"Минск (центр.)", on:45, res:0}
  ]},

    {name:"Минск (центр.)", on:120, res:10},
    {name:"Гомель", on:60, res:0}
  ]},
  {sku:"АКБ тяговая 6ЭМ-145", pr:"3 900 Br", wh:[
    {name:"Минск (центр.)", on:3, res:2}
  ]}
];
function renderStock(filter){
  filter = filter || 'Все склады';
  let body='';
  STOCK_WH.forEach(p=>{
    const whs = (filter==='Все склады') ? p.wh : p.wh.filter(w=>w.name===filter);
    if(!whs.length) return;
    const totFree = whs.reduce((s,x)=>s+(x.on-x.res),0);
    whs.forEach((w,wi)=>{
      const free = w.on - w.res, low = free<=3;
      body += `<tr class="${wi===0?'grp-first':''}">`;
      if(wi===0){
        body += `<td rowspan="${whs.length}"><input type="checkbox" onchange="smPick(this)"></td>
          <td rowspan="${whs.length}" class="pname">${p.sku}<small>Σ свободно ${totFree} · ${whs.length>1?whs.length+' склада':'1 склад'}</small></td>`;
      }
      body += `<td class="wh">🏬 ${w.name}</td>
        <td class="r">${w.on}</td>
        <td class="r res">${w.res?w.res:'—'}</td>
        <td class="r free ${low?'low':''}">${free}${low?' ⚠':''}</td>`;
      if(wi===0) body += `<td rowspan="${whs.length}" class="r price">${p.pr}</td>`;
      body += `<td class="r"><input class="q" value="0" inputmode="numeric" data-free="${free}" oninput="qtyMark(this)"></td></tr>`;
    });
  });
  if(!body) body = '<tr><td colspan="8" style="text-align:center;color:#9aa3b0;padding:18px">Нет позиций на этом складе</td></tr>';
  document.getElementById('smRows').innerHTML = `<table class="stbl">
    <thead><tr><th></th><th>Товар</th><th>Склад</th><th class="r">Остаток</th><th class="r">Резерв</th><th class="r">Свободно</th><th class="r">Цена</th><th class="r">Кол-во</th></tr></thead>
    <tbody>${body}</tbody></table>`;
  document.getElementById('smCnt').textContent = 'Выбрано: 0 · ' + (filter==='Все склады'?'со всех складов':filter);
}
function openStockMore(){
  const sel=document.getElementById('smWh'); if(sel) sel.value='Все склады';
  renderStock('Все склады');
  document.getElementById('stockMoreOv').classList.add('show');
}
function smCount(){ const n=document.querySelectorAll('#smRows input[type=checkbox]:checked').length; document.getElementById('smCnt').textContent='Выбрано: '+n+' поз.'; }
/* отметка галочки сразу проставляет кол-во 1 (чтобы добавлялось без ручного ввода) */
function smPick(cb){
  const tr=cb.closest('tr'); const q=tr?tr.querySelector('input.q'):null;
  if(q){ if(cb.checked && (parseInt(q.value)||0)===0){ q.value=1; } if(!cb.checked){ q.value=0; } qtyMark(q); }
  smCount();
}
function qtyMark(inp){
  const q=parseInt(inp.value)||0, free=parseInt(inp.dataset.free)||0;
  if(q>free){ inp.style.borderColor='#F59E0B'; inp.style.background='#FFFBEB'; inp.title=`Под заказ: дефицит ${q-free} шт → в закупку`; }
  else { inp.style.borderColor=''; inp.style.background=''; inp.title=''; }
}
function closeStockMore(){ document.getElementById('stockMoreOv').classList.remove('show'); }

/* ── предпросмотр счёта / договора (строятся из заказа динамически) ── */
function fmt(n){ return Math.round(n).toLocaleString('ru-RU').replace(/,/g,' '); }
function toast(msg){
  let t=document.getElementById('toast');
  if(!t){ t=document.createElement('div'); t.id='toast';
    t.style.cssText='position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#111827;color:#fff;padding:11px 18px;border-radius:10px;font-size:13px;z-index:9999;box-shadow:0 8px 24px rgba(0,0,0,.25);transition:opacity .3s;max-width:80vw;text-align:center';
    document.body.appendChild(t); }
  t.textContent=msg; t.style.opacity='1';
  clearTimeout(window._toastT); window._toastT=setTimeout(()=>{ t.style.opacity='0'; },3200);
}
/* покупатель: новый клиент (если подтянули реквизиты) либо текущий клиент */
function buyerLine(){
  const rl=document.getElementById('reqLive');
  if(rl && rl.textContent.includes('Стартлайн')) return 'ООО «Стартлайн», УНП '+((document.getElementById('unpLive')||{}).value||'191234567')+', г. Минск';
  const rb=document.getElementById('reqBox');
  if(rb && rb.textContent.includes('Стартлайн')) return 'ООО «Стартлайн», УНП '+((document.getElementById('unpIn')||{}).value||'191234567')+', г. Минск';
  return 'ОАО «Белтранс», УНП 190283746, г. Гомель';
}
/* отмеченные строки заказа (.ministock активного состояния) */
function orderRows(){
  const ms=document.querySelector('.ministock'); if(!ms) return [];
  return [...ms.querySelectorAll('.ms-row')].filter(r=>{ const cb=r.querySelector('input[type=checkbox]'); return cb && cb.checked; })
    .map(r=>({
      name: r.querySelector('.nm').childNodes[0].textContent.trim(),
      price: parseInt((r.querySelector('.pr').textContent||'').replace(/[^\d]/g,''))||0,
      qty: parseInt((r.querySelector('.q')||{}).value)||0
    })).filter(x=>x.qty>0);
}
/* добавить выбранное из пикера в заказ (.ministock) */
function confirmStockMore(){
  const ms=document.querySelector('.ministock'); if(!ms){ closeStockMore(); return; }
  const groups=[];
  [...document.querySelectorAll('#smRows tbody tr')].forEach(tr=>{
    const pn=tr.querySelector('.pname');
    if(pn){ const cb=tr.querySelector('input[type=checkbox]');
      groups.push({checked:!!(cb&&cb.checked), name:pn.childNodes[0].textContent.trim(),
        price:parseInt(((tr.querySelector('.price')||{}).textContent||'').replace(/[^\d]/g,''))||0, qty:0, free:0}); }
    const q=tr.querySelector('input.q');
    if(q && groups.length){ const g=groups[groups.length-1]; g.qty+=parseInt(q.value)||0; g.free+=parseInt(q.dataset.free)||0; }
  });
  let added=0;
  groups.forEach(g=>{
    if(!g.checked && g.qty<=0) return;   // не отмечено и без количества — пропуск
    if(g.qty<=0) g.qty=1;                 // отмечено галочкой без кол-ва → 1 шт

    const ex=[...ms.querySelectorAll('.ms-row')].find(r=>r.querySelector('.nm').childNodes[0].textContent.trim()===g.name);
    if(ex){ const qi=ex.querySelector('.q'); qi.value=(parseInt(qi.value)||0)+g.qty; if(!ex.querySelector('input[type=checkbox]').checked) ex.querySelector('input[type=checkbox]').checked=true; }
    else { const def=g.qty>g.free?g.qty-g.free:0; const row=document.createElement('div'); row.className='ms-row';
      row.innerHTML=`<input type="checkbox" checked><div class="nm">${g.name}<small>${def?('● под заказ: дефицит '+def+' шт → в закупку'):('● свободно '+g.free)}</small></div><div class="pr">${fmt(g.price)} Br</div><input class="q" value="${g.qty}">`;
      ms.appendChild(row); }
    added++;
  });
  closeStockMore();
  if(added) toast(`✓ Добавлено в заказ: ${added} поз. — нажмите «Проверить и отправить счёт»`);
  else toast('Отметьте товар галочкой и укажите количество');
}
