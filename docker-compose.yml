# Локальная среда каркаса (Блок А дорожной карты).
# Поднимает: postgres (16 + pgvector), redis, keycloak и приложение.
# Приложение при старте само применяет миграции (alembic upgrade head).
name: aios

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: aios
      POSTGRES_PASSWORD: aios
      POSTGRES_DB: aios
    # SECURITY.md P0-7: published-порт только на loopback — Postgres (aios/aios) не торчит
    # в LAN/Tailscale/интернет. Контейнеры ходят по имени сервиса `postgres:5432` (docker-сеть),
    # локальный seed/psql — через localhost. Наружу БД не нужна никому.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aios -d aios"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    # SECURITY.md P0-7: published-порт только на loopback (Redis без пароля). Контейнеры
    # ходят по `redis:6379` через docker-сеть — наружу порт не нужен.
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: aios
      KC_DB_PASSWORD: aios
    # SECURITY.md P0-7: в проде забиндить на loopback ("127.0.0.1:8080:8080") и пускать
    # только через TLS-прокси/туннель. Не делаю по умолчанию: зависит от топологии прокси
    # (на хосте через loopback vs прямой Tailscale-доступ). admin/admin — только dev.
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build: .
    environment:
      # SECURITY (прод-дыра): НЕ хардкодить dev. Хардкод в `environment:` ПЕРЕБИВАЕТ серверный
      # .env, из-за чего прод-гард `_no_dev_defaults_in_prod` (config/settings.py) коротит на
      # startswith("dev") → app доверяет заголовку X-User-Roles = вход суперюзером без пароля на
      # публичном belakb.by. Substitution: локаль (env не задан) → дефолт dev; прод задаёт реальные
      # значения в untracked `.env` рядом с compose ИЛИ в docker-compose.override.yml (см. RELEASE.md §2).
      AIOS_ENVIRONMENT: ${AIOS_ENVIRONMENT:-dev}
      AIOS_AUTH_MODE: ${AIOS_AUTH_MODE:-dev}
      AIOS_DATABASE_URL: ${AIOS_DATABASE_URL:-postgresql+psycopg://aios:aios@postgres:5432/aios}
      AIOS_REDIS_URL: ${AIOS_REDIS_URL:-redis://redis:6379/0}
      AIOS_KEYCLOAK_ISSUER: ${AIOS_KEYCLOAK_ISSUER:-}
      AIOS_KEYCLOAK_AUDIENCE: ${AIOS_KEYCLOAK_AUDIENCE:-}
      AIOS_KEYCLOAK_JWKS_URI: ${AIOS_KEYCLOAK_JWKS_URI:-}
      # Приглашения используют отдельный service account. Секрет клиента — только в host-.env.
      AIOS_KEYCLOAK_ADMIN_BASE_URL: ${AIOS_KEYCLOAK_ADMIN_BASE_URL:-}
      AIOS_KEYCLOAK_ADMIN_REALM: ${AIOS_KEYCLOAK_ADMIN_REALM:-aios}
      AIOS_KEYCLOAK_ADMIN_CLIENT_ID: ${AIOS_KEYCLOAK_ADMIN_CLIENT_ID:-}
      AIOS_KEYCLOAK_ADMIN_CLIENT_SECRET: ${AIOS_KEYCLOAK_ADMIN_CLIENT_SECRET:-}
      AIOS_KEYCLOAK_INVITE_CLIENT_ID: ${AIOS_KEYCLOAK_INVITE_CLIENT_ID:-aios-backend}
      AIOS_KEYCLOAK_INVITE_REDIRECT_URI: ${AIOS_KEYCLOAK_INVITE_REDIRECT_URI:-}
      AIOS_KEYCLOAK_INVITE_LIFESPAN_SECONDS: ${AIOS_KEYCLOAK_INVITE_LIFESPAN_SECONDS:-43200}
      # 1С OData (чтение). Пустые → mock OneCClient. Секреты только в host-.env.
      AIOS_ONEC_BASE_URL: ${AIOS_ONEC_BASE_URL:-}
      AIOS_ONEC_USER: ${AIOS_ONEC_USER:-}
      AIOS_ONEC_PASSWORD: ${AIOS_ONEC_PASSWORD:-}
      AIOS_ALFA_BASE_URL: ${AIOS_ALFA_BASE_URL:-}
      AIOS_ALFA_TOKEN: ${AIOS_ALFA_TOKEN:-}
      AIOS_ALFA_ACCOUNT: ${AIOS_ALFA_ACCOUNT:-}
      AIOS_GSHEETS_CREDENTIALS_FILE: ${AIOS_GSHEETS_CREDENTIALS_FILE:-}
      AIOS_GSHEETS_SPREADSHEET_ID: ${AIOS_GSHEETS_SPREADSHEET_ID:-}
      # Телефония zruchna — задаётся на хосте через /opt/cmr-erp/.env (compose автозагрузка).
      # Пустые → коннектор отключён (graceful). См. coordination/belakb-golive-plan.md §Фаза-2.
      AIOS_TELEPHONY_WEBHOOK_TOKEN: ${AIOS_TELEPHONY_WEBHOOK_TOKEN:-}
      AIOS_TELEPHONY_ORIGINATE_URL: ${AIOS_TELEPHONY_ORIGINATE_URL:-}
    # SECURITY.md P0-7: в проде забиндить на loopback ("127.0.0.1:8000:8000") и пускать
    # только через TLS-прокси. Не делаю по умолчанию: если прокси/Tailscale ходит к app не
    # через хостовой loopback — bind на 127.0.0.1 оборвёт доступ. См. ops-вопрос в STATUS.
    ports:
      - "8000:8000"
    # Вложения лидов (сканы тендерных заявок, файлы писем) пишутся на диск в ./data
    # (modules/leads/storage.py, WORKDIR=/app) — без тома исчезают при каждой пересборке
    # контейнера. Именованный том переживает rebuild; в проде можно заменить на bind-маунт
    # на хостовой каталог с бэкапом.
    volumes:
      - appdata:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  appdata:
