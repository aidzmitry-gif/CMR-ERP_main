# Минимальный compose каркаса — только само приложение.
# В части 1 сюда добавляются postgres (16 + pgvector), redis, keycloak,
# temporal и minio (см. дорожную карту, Блок А).
services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
