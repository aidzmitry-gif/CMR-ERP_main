function statusBadge(v){
  var s=(''+v).toLowerCase();
  if(s.indexOf('актив')>=0) return '<span class="rounded-full bg-emerald-50 px-2 py-0.5 text-[11px] font-semibold text-emerald-700">'+v+'</span>';
  if(s.indexOf('архив')>=0) return '<span class="rounded-full bg-slate-100 px-2 py-0.5 text-[11px] text-slate-500">'+v+'</span>';
  return v;
}
function getParam(n){return new URLSearchParams(location.search).get(n);}

(function(){
  var key=getParam('ref')||'units';
  var r=REFS[key];
  if(!r){ document.getElementById('ttl').textContent='Справочник не найден'; document.getElementById('sub').textContent='Ключ «'+key+'» отсутствует в конфиге.'; return; }
  document.title=r.t+' — справочник';
  document.getElementById('ttl').textContent=r.t;
  document.getElementById('sub').textContent=r.d;
  document.getElementById('meta').innerHTML=
    '<span class="text-base font-bold text-ink">'+r.t+'</span>'+
    '<span class="rounded-full bg-slate-100 px-2 py-0.5 text-[11px] font-mono text-slate-600">/refs/'+key+'</span>'+
    '<span class="rounded-full bg-emerald-50 px-2 py-0.5 text-[11px] text-emerald-700">🤖 в каталоге AI</span>'+
    '<span class="rounded-full bg-blue-50 px-2 py-0.5 text-[11px] text-blue-700">права: refs.view · refs.edit</span>';
  // заголовки
  var th=r.cols.map(function(c){return '<th class="px-5 py-2 font-semibold">'+c+'</th>';}).join('')+'<th class="px-3 py-2"></th>';
  document.getElementById('thead').innerHTML=th;
  // строки
  var lastCol=r.cols.length-1;
  var body=r.rows.map(function(row){
    var tds=row.map(function(cell,i){
      var cls='px-5 py-2.5 '+(i===0?'font-mono text-[13px] text-slate-500':'text-slate-600');
      var val=(i===lastCol)?statusBadge(cell):cell;
      return '<td class="'+cls+'">'+val+'</td>';
    }).join('');
    return '<tr class="hover:bg-slate-50/60 cursor-pointer" data-demo="Открыть запись">'+tds+'<td class="px-3 py-2.5 text-right text-slate-300">⋯</td></tr>';
  }).join('');
  document.getElementById('tbody').innerHTML=body;
  document.getElementById('foot').textContent='Записей: '+r.rows.length+' · архив вместо удаления · правки пишутся в аудит. Демо-данные.';
})();

/* демо-тост */
(function(){
  function dtoast(msg){var t=document.getElementById('_demoToast');if(!t){t=document.createElement('div');t.id='_demoToast';t.style.cssText='position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(10px);background:#0f172a;color:#f1f5f9;font:600 13px ui-sans-serif,system-ui;padding:10px 16px;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:99999;opacity:0;pointer-events:none;transition:.22s;max-width:90vw';document.body.appendChild(t);}t.textContent=msg;t.style.opacity='1';t.style.transform='translateX(-50%) translateY(0)';clearTimeout(t._h);t._h=setTimeout(function(){t.style.opacity='0';t.style.transform='translateX(-50%) translateY(10px)';},1900);}
  document.addEventListener('click',function(e){
    var el=e.target.closest('[data-demo],button,a[href="#"]');
    if(!el)return;
    if(el.id==='themeTgl'||el.closest('#themeTgl'))return;
    if(el.hasAttribute('onclick')||el.closest('[onclick]'))return;
    if(el.tagName==='A'&&el.getAttribute('href')&&el.getAttribute('href')!=='#')return;
    if(el.tagName==='A')e.preventDefault();
    var label=(el.getAttribute('data-demo')||el.textContent||'').trim().slice(0,40)||'Действие';
    dtoast('Демо: «'+label+'» — действие появится с бэкендом');
  },true);
})();
</script>
